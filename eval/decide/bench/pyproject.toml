[project]
name = "decide-bench"
version = "0.1.0"
description = "D0-5 横评脚本：Agent24 决策服务候选模型横向评测"
requires-python = ">=3.11"
dependencies = [
  "transformers>=4.46,<6",
  "torch>=2.2",
  "sentencepiece>=0.2.0",
  "gliclass>=0.1.20",
  "setfit>=1.2.0",
  "sentence-transformers>=3.0",
  "huggingface-hub>=0.26",
  "psutil>=6.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
mlx = [
  "mlx-lm>=0.19",
]
# NOTE: there is deliberately no "export" extra for ONNX (optimum /
# onnxruntime) here — `optimum[onnxruntime]` needs `transformers<4.47`
# while `gliclass` (a base dependency of this project) needs
# `transformers>=5.0`, a genuine, unresolvable conflict for one shared
# lockfile. scripts/export_onnx.py instead runs in its own ephemeral
# `uv run --isolated --with ...` environment — see that script's header
# and the bench README's ONNX section.

[project.scripts]
bench = "decide_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decide_bench"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# mDeBERTa / Erlangshen / SetFit / GLiClass run fine on CPU or MPS; torch wheel
# from PyPI already ships Apple Silicon (MPS) support, no special index needed.
