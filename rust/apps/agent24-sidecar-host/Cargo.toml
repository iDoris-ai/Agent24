[package]
name = "agent24-sidecar-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent24-sidecar-host-protocol = { path = "../../crates/agent24-sidecar-host-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
processkit = { version = "=3.3.4", features = ["stats"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
