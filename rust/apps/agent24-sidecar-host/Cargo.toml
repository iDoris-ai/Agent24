[package]
name = "agent24-sidecar-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "frozen (ADR-038 Q1=(b)): Open Design is hosted by SidecarManager; this crate is not on the product path"

[dependencies]
agent24-sidecar-host-protocol = { path = "../../crates/agent24-sidecar-host-protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
processkit = { git = "https://github.com/jhfnetboy/ProcessKit-rs.git", rev = "60aa827db378daa5b1ec638f3b3fdaaf9c201560", features = ["stats"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[lints]
workspace = true
