# Documenting domain OS (ADR-DOC-01 D3). Identity is derived from `name`:
# namespace /api/v1/documents, data dir ~/.agent24/os/documents/, events with module `documents`.
name: documents
version: "0.2.0"
route_namespace: /api/v1/documents
event_module: documents
data_dir: ~/.agent24/os/documents/
# events: job progress (ADR-DOC-02 §7). models: extraction runs on the kernel's model router.
kernel_capabilities: [events, models]
# ADR-DOC-01 D8: written out even though it is the default.
model_access: local_only
impl_kind: out_of_process_provider
spawn:
  command: bin/agent24-documents
# Extraction sends `temperature` (ADR-DOC-02 §3.2), which only a v2 kernel takes
# (ME4-S2b). D2b: v4 is the kernel that takes grants for these tools (K1-6a-G).
min_daemon_protocol: 4
# D2b (Loop 2): what an Agent may call, once the user has granted it the
# documents (`doc:<id>`). Each call of `compose` is still approved by the user.
tools:
  - operation: list
    description: "List the documents in the user's library on this machine that the user allowed. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      properties:
        cursor: { type: string }
        limit: { type: integer, minimum: 1, maximum: 200 }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: get
    description: "Get one document's title, format, pages and current revision. document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: compose
    # M1 (Loop 5): a 4-bit model put both halves of a split into one call, which merges them
    # back; saying that each call makes exactly one document took that from 5/8 to 0/8 runs.
    description: "Make ONE new PDF document from pages of PDF documents in the library; each call makes exactly one document. Merge (several documents into one): one call with several parts. Split (one document into N documents): call this tool N times, each call with ONE part; never put the pieces of a split into one call, that merges them back. The originals are never changed. Returns the import job; the new document is its result."
    input_schema:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [document_id]
            properties:
              document_id: { type: string, description: "a PDF document: its id from documents.list, or its file name/title (e.g. report.pdf)" }
              pages: { type: string, description: "\"all\" (default) or 1-based pages and ranges such as \"1-3,5\"; \"2-\" is page 2 to the last" }
        title: { type: string, description: "title of the new document" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  # E1b/D5a (Loop 3): DOCX paragraphs and template fields. The writes make a
  # NEW document; each call is approved by the user.
  - operation: paragraphs
    description: "List a DOCX document's paragraphs (index, text, whether in a table). document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: patch
    description: "Make a NEW DOCX document from a DOCX with some paragraphs rewritten, by index from documents.paragraphs (each edit gives the paragraph's opening words as anchor); tracked=true writes the change as a Word revision. The original is never changed. Returns the import job."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id, edits]
      properties:
        document_id: { type: string }
        edits:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [index, text, anchor]
            properties:
              index: { type: integer, minimum: 0 }
              text: { type: string, description: "the paragraph's new text" }
              tracked: { type: boolean }
              anchor: { type: string, description: "the first 8 or so characters of paragraph `index` as documents.paragraphs shows it; the edit is not made if that paragraph does not begin with them" }
        title: { type: string, description: "title of the new document" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: fields
    description: "List the {{field}} placeholders of a DOCX template. document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: fill
    description: "Make a NEW DOCX document from a DOCX template with its {{field}} placeholders filled, keeping all formatting; it is named \"<template>（填写）\". values maps a field name (without braces, as listed by documents.fields) to its text. The template is never changed. Returns the import job."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id, values]
      properties:
        document_id: { type: string }
        values:
          type: object
          minProperties: 1
          maxProperties: 200
          additionalProperties: { type: string }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
