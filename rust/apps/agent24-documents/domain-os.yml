# Documenting domain OS (ADR-DOC-01 D3). Identity is derived from `name`:
# namespace /api/v1/documents, data dir ~/.agent24/os/documents/, events with module `documents`.
name: documents
version: "0.2.0"
route_namespace: /api/v1/documents
event_module: documents
data_dir: ~/.agent24/os/documents/
# events: job progress (ADR-DOC-02 §7). models: extraction runs on the kernel's model router.
kernel_capabilities: [events, models]
# ADR-DOC-01 D8: written out even though it is the default.
model_access: local_only
impl_kind: out_of_process_provider
spawn:
  command: bin/agent24-documents
# Extraction sends `temperature` (ADR-DOC-02 §3.2), which only a v2 kernel takes
# (ME4-S2b). D2b: v4 is the kernel that takes grants for these tools (K1-6a-G).
min_daemon_protocol: 4
# D2b (Loop 2): what an Agent may call, once the user has granted it the
# documents (`doc:<id>`). Each call of `compose` is still approved by the user.
tools:
  - operation: list
    description: "List the documents in the user's library on this machine that the user allowed. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      properties:
        cursor: { type: string }
        limit: { type: integer, minimum: 1, maximum: 200 }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: get
    description: "Get one document's title, format, pages and current revision. document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: compose
    # M1 (Loop 5): a 4-bit model put both halves of a split into one call, which merges them
    # back; saying that each call makes exactly one document took that from 5/8 to 0/8 runs.
    description: "Make ONE new PDF document from pages of PDF documents in the library; each call makes exactly one document. Merge (several documents into one): one call with several parts. Split (one document into N documents): call this tool N times, each call with ONE part; never put the pieces of a split into one call, that merges them back. The originals are never changed. Returns the import job; the new document is its result."
    input_schema:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [document_id]
            properties:
              document_id: { type: string, description: "a PDF document: its id from documents.list, or its file name/title (e.g. report.pdf)" }
              pages: { type: string, description: "\"all\" (default) or 1-based pages and ranges such as \"1-3,5\"; \"2-\" is page 2 to the last" }
        title: { type: string, description: "title of the new document" }
        save_to: { type: string, enum: [new_document, original], description: "leave it out (a NEW document) unless the user explicitly asked to save into the original file (存到原文件 / 直接改原文件); original saves the result as the original document's next version, its older versions kept and restorable" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  # E1b/D5a (Loop 3): DOCX paragraphs and template fields. The writes make a
  # NEW document; each call is approved by the user.
  - operation: paragraphs
    description: "List a DOCX document's paragraphs that have text as a table of contents (toc): one line per paragraph, its index and first words. A long document comes in parts: total and next_from say what is left; ask again with from, or with query to find paragraphs containing a word. Asked with from/count or query for up to 10 paragraphs, they come whole (whole: true): get the paragraphs you rewrite this way before documents.patch. document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
        from: { type: integer, minimum: 0, description: "the paragraph index to start from (default 0)" }
        count: { type: integer, minimum: 1, maximum: 200, description: "at most this many paragraphs" }
        query: { type: string, description: "only paragraphs containing this text" }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  # L6-S05: two documents, or two versions of one, compared by their text.
  - operation: compare
    description: "Compare two documents, or two versions of one document, by their text only (formatting is not compared). Give document_id and other_document_id (ids from documents.list, or file names/titles) for two documents; give only document_id (optionally from_revision and to_revision) for one document's versions, default the last two. The answer lists the first changes (id, kind added/removed/changed/unaligned, where, text) and a summary of all of them. Report only what is in changes; never add a change yourself; for the rest tell the user to open the comparison view on the documents page. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
        other_document_id: { type: string, description: "the second document, to compare two documents" }
        from_revision: { type: integer, minimum: 1, description: "the older version (default: the one before to_revision); with other_document_id, the version of document_id" }
        to_revision: { type: integer, minimum: 1, description: "the newer version (default: the current one); with other_document_id, the version of other_document_id" }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  # L8 DOC-4: what a document still carries before it is sent out.
  - operation: preflight
    description: "Check a document before it is sent to someone, without changing it: for a Word (DOCX) document, in its body, headers and footers only (not footnotes, endnotes or styles): tracked insertions/deletions, comments, unfilled {{fields}}, author / last modified by, hidden text; for a PDF, only its author, a form and annotations. Give document_id (an id from documents.list, or the file name/title). The answer lists findings by kind with a count and examples; report only those, say what was not checked (the note), and never call the document safe to send. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: patch
    description: "Make a NEW DOCX document from a DOCX with some paragraphs rewritten, by index from documents.paragraphs (each edit gives the paragraph's opening words as anchor); tracked=true writes the change as a Word revision. By default the original is not changed and the answer is the new document's import job; save_to=original (only when the user asked for it) saves it as the original's next version instead."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id, edits]
      properties:
        document_id: { type: string }
        edits:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [index, text, anchor]
            properties:
              index: { type: integer, minimum: 0 }
              text: { type: string, description: "the paragraph's new text" }
              tracked: { type: boolean }
              anchor: { type: string, description: "at least 12 characters copied exactly from the start of paragraph `index` as documents.paragraphs shows it (its numbering may be left out, but if written it must be right); the edit is not made if that paragraph does not begin with them" }
        title: { type: string, description: "title of the new document" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: fields
    description: "List the {{field}} placeholders of a DOCX template. document_id is its id from documents.list, or its file name/title. Read-only, local."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string }
    risk: read
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  - operation: fill
    description: "Make a NEW DOCX document from a DOCX template with its {{field}} placeholders filled, keeping all formatting; it is named \"<template>（填写）\". values maps a field name (without braces, as listed by documents.fields) to its text. By default the template is not changed and the answer is the new document's import job; save_to=original (only when the user asked for it) saves it as the template's next version instead."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id, values]
      properties:
        document_id: { type: string }
        values:
          type: object
          minProperties: 1
          maxProperties: 200
          additionalProperties: { type: string }
        save_to: { type: string, enum: [new_document, original], description: "leave it out (a NEW document) unless the user explicitly asked to save into the original file (存到原文件 / 直接改原文件); original saves the result as the original document's next version, its older versions kept and restorable" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
  # L6-F2 (Loop 6): delete one whole document (soft: it can be restored for
  # 7 days on the documents page). Each call is approved by the user. The
  # pattern takes an id only, so the kernel refuses a file name before any
  # card and the card always names exactly one document (FU-136).
  - operation: delete
    description: "Delete ONE whole document from the user's library; it can be restored from the documents page for 7 days. Use it only when the user asks to delete or remove a whole document or file. Removing a paragraph or a sentence INSIDE a document is a rewrite (documents.patch), never this. document_id must be the document's id (doc_...): first look it up with documents.get by its file name; if several documents have that name, list them for the user and ask which one, never choose one yourself."
    input_schema:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id: { type: string, pattern: "^doc_[0-7][0-9A-HJKMNP-TV-Z]{25}$", description: "the document's id (doc_...) as documents.get or documents.list returned it: never its file name, never made up, never asked of the user; look it up yourself first" }
    risk: write_local
    output_privacy: local_only
    timeout_ms: 30000
    inline_wait_ms: 25000
    resource_kinds: [doc]
