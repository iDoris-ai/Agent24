[package]
name = "agent24-documents"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Documenting domain OS (ADR-DOC-01): first-party out-of-process module `documents`, served under /api/v1/documents"

[[bin]]
name = "agent24-documents"
path = "src/main.rs"

[dependencies]
agent24-os-sdk = { path = "../../crates/agent24-os-sdk" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
getrandom = { version = "0.3", features = ["std"] }
# D2: split / merge PDFs by moving the original objects (no re-drawing).
lopdf = { version = "0.47", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
# E1b: DOCX paragraph patches; every other entry is copied as stored (raw copy).
zip = { version = "2", default-features = false, features = ["deflate"] }
# PR-Daemon #1954 L2 (PM: must fix): every part the patcher rewrites is parsed
# once before it is written, so a broken document.xml is an error, never Ok.
roxmltree = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"
# L8-S02 (R0 一致裁决): a field label is matched to the allowlist of safe
# text fields after NFKC, without format (Cf) characters.
unicode-general-category = "1.1"
unicode-normalization = "0.1"

[dev-dependencies]
# The kernel's own manifest validator, so the test proves the daemon would accept domain-os.yml.
agent24-domain = { path = "../../crates/agent24-domain" }
# The kernel's own result-envelope parser, so the tool tests prove it accepts what we send.
agent24-os-proto = { path = "../../crates/agent24-os-proto" }
tempfile = "3"
# `start_paused` for tests that assert on elapsed time without the wall clock.
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
