[package]
name = "agent24-cli"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 CLI — talks the v1 protocol to agent24d (attached via ~/.agent24/daemon.json, or standalone by spawning an ephemeral daemon)"

[[bin]]
name = "agent24"
path = "src/main.rs"

[features]
# Only for native ad-hoc package fixtures in macOS black-box tests. Never ship this feature.
test-support = ["agent24-os-packages/test-support"]

[dependencies]
agent24-os-proc = { path = "../../crates/agent24-os-proc" }
# `documents render --out`: the page comes as base64 in the JSON result.
base64 = "0.22"
# `documents render --out`: the page goes into a file of its own beside the
# target first and is renamed over it, so a failure leaves the target as it was.
tempfile = "3"
agent24-documents-client = { path = "../../crates/agent24-documents-client" }
agent24-hw = { path = "../../crates/agent24-hw" }
agent24-protocol = { path = "../../crates/agent24-protocol" }
agent24-mcp = { path = "../../crates/agent24-mcp" }
agent24-os-packages = { path = "../../crates/agent24-os-packages" }
# Decision-log export/delete have no daemon route. They open agent24.db only
# after the offline gate (the daemon singleton lock, dock markers, no
# migration). See `offline_db` and `cmd_decide`.
agent24-store = { path = "../../crates/agent24-store" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `agent24 comm import`'s TTY password prompt disables local echo while the
# user types (Codex 挑战 Medium #6) via `tcgetattr`/`tcsetattr` — the same
# crate `agent24-comm` already uses for its own fd-level checks, so no new
# dependency family. `process`: `agent24 service install` checks the
# service's daemon has exited with `kill(pid, 0)` (M5 B1).
rustix = { version = "0.38", features = ["fs", "process", "pty", "termios"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "signal", "net"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
# enroll.rs: sha256 of the exact request body for `elevate` (plan §3.1).
sha2 = "0.10"
# TUI (C6)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
# localhost only (ws://, never wss) — `connect` gives connect_async
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }
fs2 = "0.4"

[dev-dependencies]
# os_uninstall_consents: a store that opens but refuses the revocation.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Native launchers and `files.json` for packages these tests install.
agent24-os-packages = { path = "../../crates/agent24-os-packages", features = ["test-support"] }

[lints]
workspace = true
