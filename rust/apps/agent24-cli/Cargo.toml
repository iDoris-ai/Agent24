[package]
name = "agent24-cli"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 CLI — talks the v1 protocol to agent24d (attached via ~/.agent24/daemon.json, or standalone by spawning an ephemeral daemon)"

[[bin]]
name = "agent24"
path = "src/main.rs"

[dependencies]
agent24-protocol = { path = "../../crates/agent24-protocol" }
agent24-mcp = { path = "../../crates/agent24-mcp" }
agent24-os-packages = { path = "../../crates/agent24-os-packages" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `agent24 comm import`'s TTY password prompt disables local echo while the
# user types (Codex 挑战 Medium #6) via `tcgetattr`/`tcsetattr` — the same
# crate `agent24-comm` already uses for its own fd-level checks, so no new
# dependency family.
rustix = { version = "0.38", features = ["termios"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
# TUI (C6)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
# localhost only (ws://, never wss) — `connect` gives connect_async
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
