[package]
name = "agent24d"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 Rust daemon — v1 protocol server (B2: skeleton — health, auth handshake, graceful shutdown)"

[dependencies]
agent24-agent = { path = "../../crates/agent24-agent" }
agent24-core = { path = "../../crates/agent24-core" }
agent24-domain = { path = "../../crates/agent24-domain" }
agent24-os-packages = { path = "../../crates/agent24-os-packages" }
agent24-mcp = { path = "../../crates/agent24-mcp" }
agent24-memory = { path = "../../crates/agent24-memory" }
agent24-models = { path = "../../crates/agent24-models" }
agent24-policy = { path = "../../crates/agent24-policy" }
agent24-scheduler = { path = "../../crates/agent24-scheduler" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
# T8.5c-P: cursor tokens are `base64(v2:<seq>:<fingerprint>)` (design §7.1).
base64 = "0.22"
agent24-store = { path = "../../crates/agent24-store" }
agent24-tools = { path = "../../crates/agent24-tools" }
agent24-protocol = { path = "../../crates/agent24-protocol" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
http-body-util = "0.1"
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
# ME4-4.2.3b (design §6.5): `GET /api/v1/usage?module=` reads the raw query
# string itself (via `axum::extract::RawQuery`) rather than axum's `Query`
# extractor, so a malformed `module`-less query never turns into a 400 (v2
# L5). `form_urlencoded::parse` (not `serde_urlencoded`, review L1): it is
# INFALLIBLE — invalid percent-encoding decodes losslessly to U+FFFD rather
# than erroring — so there is no error branch to (mis-)handle, and no way for
# one malformed key/value pair to hide an unrelated, well-formed `module=`
# key elsewhere in the same query string.
form_urlencoded = "1"
# T8.5c-P: `EventLog::scan_stream`'s consumer (`os_memory_page.rs`) drives it
# with `StreamExt::next()`/`Pin<&mut S>` directly, not through sqlx.
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The module trampoline (`run_as_trampoline_if_asked`, first thing in `main`):
# a module is started through this binary so its fds are flagged
# close-on-exec in the child (ME3-SUP slice 1). The rest of the crate — the
# proxy, the supervisor — is wired in by later slices.
agent24-os-proto = { path = "../../crates/agent24-os-proto" }
# SHUT-1b: open the shutdown evidence without following a link or blocking on
# a FIFO (already in the tree through agent24-os-proto).
rustix = { version = "0.38", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
# T7b/ME-3e: forces a transient `Store` error in the timeout-scan test by
# dropping `module_approvals` out from under a live pool — there is no
# fault-injectable `Store` trait to mock instead.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tower = { version = "0.5", features = ["util"] }
# A paused clock, for deadlines asserted exactly rather than with slack.
tokio = { version = "1", features = ["test-util"] }
# T9/ME-3f: the black-box test observes event forwarding at the real
# `GET /api/v1/events` consumer boundary, not just the callback's ack — same
# version/feature set `agent24-cli`'s TUI already uses as a client.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[lints]
workspace = true
