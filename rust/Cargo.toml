[workspace]
resolver = "2"
members = [
    "crates/agent24-agent",
    "crates/agent24-comm",
    "crates/agent24-core",
    "crates/agent24-decide",
    "crates/agent24-domain",
    "crates/agent24-os-fd",
    "crates/agent24-os-cwd",
    "crates/agent24-os-packages",
    "crates/agent24-os-proto",
    "crates/agent24-os-sdk",
    "crates/agent24-sidecar-host-protocol",
    "apps/agent24-sidecar-host",
    "crates/agent24-mcp",
    "crates/agent24-memory",
    "crates/agent24-models",
    "crates/agent24-protocol",
    "crates/agent24-scheduler",
    "crates/agent24-policy",
    "crates/agent24-store",
    "crates/agent24-workspace",
    "crates/agent24-tools",
    "crates/agent24-worker",
    "apps/agent24d",
    "apps/agent24-cli",
    "apps/agent24-documents",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iDoris-ai/Agent24"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Rust 1.99 起 clippy 对 `#[async_trait]` 宏展开出的 `#[must_use]` 报 double_must_use
# （宏给生成的 fn 加了 must_use，而返回的 Pin<Box<Future>> 本身已 must_use）。
# 触发点全在 async-trait 0.1.91 的生成代码里，不是手写属性；CI 装最新 stable，不放行会让所有 PR 红。
double_must_use = "allow"
# SPEC-001 §5: no unwrap/expect outside tests
unwrap_used = "deny"
expect_used = "deny"
