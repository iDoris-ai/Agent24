[package]
name = "agent24-decide"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 decision service (D0): DecisionRequest/Question/Decision types, DecisionBackend trait, RuleBackend, layered DecisionService — no silent downgrade, no global threshold default (docs/agent/PLAN-DECIDE.md, docs/decision.md ADR-033)"

[dependencies]
agent24-hw = { path = "../agent24-hw" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.21", optional = true }

[features]
default = []
onnx-spike = ["dep:ort", "dep:tokenizers"]

[[test]]
name = "onnx_spike"
path = "tests/onnx_spike.rs"
required-features = ["onnx-spike"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
