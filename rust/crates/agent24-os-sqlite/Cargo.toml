[package]
name = "agent24-os-sqlite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrow SQLite online-backup boundary over sqlx connection handles (CORE-5d)"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# Must stay on the exact version sqlx-sqlite links (0.30.x): two versions of
# the -sys crate fail to link. Cargo.lock is the proof; see the spike test.
libsqlite3-sys = { version = "0.30.1", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
