[package]
name = "agent24-sin90-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sin90 persistence — sqlx over its own sin90.db, enforcing agent24-sin90 transitions; CAS-idempotent Proposal apply + self-contained event replay (SIN90-domain.md §3)"

[dependencies]
agent24-sin90 = { path = "../agent24-sin90" }
agent24-core = { path = "../agent24-core" }        # util only: ulid() + now_iso8601() (kernel reuse, one-way dep)
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"

[features]
# test-only helpers (raw-SQL peeks/mutations); never on for released builds.
test-hooks = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Self-dependency with the feature on, so integration tests (a separate crate)
# can reach `test_hooks` while downstream consumers never get it.
agent24-sin90-store = { path = ".", features = ["test-hooks"] }

[lints]
workspace = true
