[package]
name = "agent24-agent"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 run manager — the agent loop (C2 scope: run lifecycle with first-class cancellation, persistence and events)"

[features]
# `RunManager::fail_next_inbound_start`. Off unless a test build asks for it.
# agent24d enables this only as a dev-dependency, so a release daemon does not
# carry the injector.
test-support = []

[dependencies]
agent24-scheduler = { path = "../agent24-scheduler" }
agent24-core = { path = "../agent24-core" }
agent24-domain = { path = "../agent24-domain" }
agent24-memory = { path = "../agent24-memory" }
async-trait = "0.1"
agent24-models = { path = "../agent24-models" }
agent24-protocol = { path = "../agent24-protocol" }
agent24-skill = { path = "../agent24-skill" }
agent24-store = { path = "../agent24-store" }
agent24-tools = { path = "../agent24-tools" }
agent24-workspace = { path = "../agent24-workspace" }
serde_json = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
agent24-policy = { path = "../agent24-policy" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
