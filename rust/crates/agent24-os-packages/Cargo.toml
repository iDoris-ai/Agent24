[package]
name = "agent24-os-packages"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 domain-OS packages on disk (ME-3a): discovery and atomic install"

[dependencies]
agent24-domain = { path = "../agent24-domain" }
serde_yaml = "0.9"
# For `geteuid` — a SAFE wrapper over the syscall. See `effective_uid`: the
# dependency-free alternative (create a file, ask who owns it) was attacker-
# influenceable, which is a worse trade than one small crate.
rustix = { version = "0.38", features = ["process"] }
# The manifest digest a module reports in its handshake (SUP-4).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
