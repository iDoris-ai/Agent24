[package]
name = "agent24-store"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 persistence — sqlx SQLite repositories enforcing agent24-core transitions, plus a hash-chained audit log"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
agent24-core = { path = "../agent24-core" }
agent24-protocol = { path = "../agent24-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["sync"] }
thiserror = "2"

[dev-dependencies]
agent24-decide = { path = "../agent24-decide" }
tempfile = "3"
# Workspace allocation temporal tests use Tokio's time utilities.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
