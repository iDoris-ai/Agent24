[package]
name = "agent24-domain"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 domain-OS contract (M-E/ME-1): DomainModule + KernelCtx traits, manifest, module-scoped event sink"

[dependencies]
agent24-protocol = { path = "../agent24-protocol" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
