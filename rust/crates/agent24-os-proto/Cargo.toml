[package]
name = "agent24-os-proto"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 kernel↔domain-OS protocol (ME-3b): version negotiation, framing, handshake, launch, supervision, constrained proxy"

[dependencies]
agent24-domain = { path = "../agent24-domain" }
# ME4-S3 §4.3: the one crate allowed to turn the kernel-inherited listen fd
# into a socket — `module::take_listener` delegates to it.
agent24-os-fd = { path = "../agent24-os-fd" }
axum = { version = "0.8" }
# 1.9 for `Bytes::from_owner` — see `PermitBytes`.
bytes = "1.9"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
# For signalling a process GROUP — a safe wrapper over `killpg`.
rustix = { version = "0.38", features = ["process"] }
# `sync` for the revocation signal (`watch`) and the callback channels; `macros`
# for `select!` (the proxy's race against revocation, and `rpc::serve`); `rt` +
# `io-util` for the callback connection loop (ME-3c).
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "io-util", "process", "signal", "net"] }
# Passing the proxy's listening socket to a module as fd 3 (SPEC-ME3 §1). The
# fd mapping has to run between fork and exec (`pre_exec`), which is `unsafe`;
# this crate keeps `forbid(unsafe_code)` and takes that one step from a small,
# Google-maintained crate instead (ME3-SUP decision D3, 2026-09-12).
command-fds = { version = "0.3.3", features = ["tokio"] }
# The module trampoline marks every fd from 4 up close-on-exec before it execs
# the module, so only 0–3 reach it. `set_fds_cloexec_threadsafe` is a safe
# function; doing the same between fork and exec would need `unsafe` here
# (review of SUP-1, rounds 1–2; user decision: a trampoline).
# Pinned exactly: the trampoline mirrors this version's fallback-scan bound
# (`launch::fallback_scan_end`), so an upgrade must re-read it.
close_fds = "=0.3.2"
# SPEC §4: a request abandoned by a revocation is logged as "outcome unknown".
tracing = "0.1"
# T7b/ME-3e: hashing `X-A24-Approval-Token` for storage/comparison (design
# doc, decision 2) — the plaintext token is never kept. Minting itself reads
# /dev/urandom directly (`launch::mint_token`'s existing precedent), so no
# separate RNG crate is added.
sha2 = "0.10"
# ME4-S3 §4.4: `manifest::facts_from_yaml` reads the module-side manifest
# facts (name/route_namespace/kernel_capabilities) leniently, same crate
# `agent24-domain` already depends on for its own (strict) manifest parsing.
serde_yaml = "0.9"

[dev-dependencies]
# B2 (external review of #515): the `test-util`-gated handshake tests
# (`connect_from_env_*`) never ran in CI because plain `cargo test`/`clippy
# --all-targets` don't pass `--features test-util`. Depending on ourselves
# with the feature turned on for dev builds only pulls it in for `#[cfg(test)]`
# builds of this crate, so the default `cargo test -p agent24-os-proto` and
# `cargo clippy --all-targets` now cover them without a workspace-wide
# feature flip.
agent24-os-proto = { path = ".", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# To assert the "outcome unknown" log line is actually written.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[features]
# ME4-S3 §4.5 (H4): `module::testing`'s in-memory fake kernel — an
# in-process fixture, not a `#[cfg(test)]` item, so downstream crates (the
# SDK, and through it Sin90/Cos72) can use it from their own dev-dependencies
# by enabling this feature on `agent24-os-sdk` (which forwards it, L8).
test-util = []

[lints]
workspace = true
