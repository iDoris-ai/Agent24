[package]
name = "agent24-documents-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client side of the Documenting OS routes, shared by the agent24 CLI and the desktop (ADR-DOC-02 §5.6): one implementation of importing a file"

[dependencies]
# A rendered page goes out as JSON: its PNG in base64 (ops.rs).
base64 = "0.22"
serde = { workspace = true }
# float_roundtrip: numbers parse exactly, as JSON.parse does (an offset or a
# limit written as 10.000000000000001 is not 10).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Plain HTTP to 127.0.0.1 only: no TLS, no proxy (http.rs).
reqwest = { version = "0.12", default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "net", "time", "test-util"] }

[lints]
workspace = true
