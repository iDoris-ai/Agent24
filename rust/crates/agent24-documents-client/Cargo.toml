[package]
name = "agent24-documents-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client side of the Documenting OS routes, shared by the agent24 CLI and the desktop (ADR-DOC-02 §5.6): one implementation of importing a file"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }

[lints]
workspace = true
