[package]
name = "agent24-os-cwd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Narrow POSIX child-cwd boundary for descriptor-pinned workspaces"

[dependencies]
rustix = { version = "0.38", features = ["process"] }
tokio = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
