[package]
name = "agent24-components"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json = { workspace = true }
thiserror = "2"
semver = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "sync"] }
tokio-util = "0.7"
flate2 = "1"
tar = { version = "0.4", default-features = false }
fs2 = "0.4"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }

[features]
# Fixtures other crates need for their own tests (InstalledVersion, test_lock).
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "test-util"] }

[lints]
workspace = true
