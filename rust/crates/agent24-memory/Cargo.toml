[package]
name = "agent24-memory"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent24 memory (M-D/D1): L0 SQLite key-value store + canonical session with threshold LLM-summary compaction"

[dependencies]
agent24-core = { path = "../agent24-core" }
agent24-models = { path = "../agent24-models" }
async-trait = "0.1"
# T8.5c-P: `EventLog::scan_stream` is a genuinely streaming, row-by-row
# consumer of `sqlx::query(..).fetch(&pool)` (a `BoxStream`) — `StreamExt` and
# the `Stream` trait bound live here, not pulled in transitively, so the
# streaming contract is an explicit dependency of this crate rather than an
# accident of what sqlx happens to re-export.
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
