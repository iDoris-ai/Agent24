# cargo-deny config — SPEC-001 §9: no GPL/AGPL in the dependency tree.
# CI runs `cargo deny check licenses bans` via EmbarkStudios/cargo-deny-action.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # webpki-roots (Mozilla CA data via rustls/reqwest) — permissive data license
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# CC0-1.0 (public-domain dedication, FSF Free/Libre, Apache-2.0 compatible) is allowed
# only for these crates: secp256k1 verifies that a decrypted NIP-49 backup derives the
# identity's npub (agent24-comm export/restore, #1535). Not added to `allow` globally.
exceptions = [
  { allow = ["CC0-1.0"], crate = "secp256k1" },
  { allow = ["CC0-1.0"], crate = "secp256k1-sys" },
]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/jhfnetboy/ProcessKit-rs.git",
]
