name: Hyphae lock verify

# COMM-1a/COMM-1b + ADR-038 C1b: `hyphae.lock.json` is Hyphae's published schema-2
# ComponentLock. Its `reproducible.recipe` is a documented, reproducible build; this
# job proves it: check out Hyphae at `source.commit`, build one platform with the
# recipe verbatim (`<os>`/`<arch>` substituted, including its `-X main.version=<tag>`),
# and compare against the lock — every value read from the lock, none duplicated here:
#   - linux-x64 (unsigned): the build must equal `assets.linux-x64.sha256`, which must
#     in turn equal `reproducible.unsigned_sha256.linux-x64`;
#   - darwin-arm64 (Developer ID signed + notarized, which changes the bytes): the build
#     must equal `reproducible.unsigned_sha256.darwin-arm64`, never the signed asset hash.
# It then publishes, for the Rust test jobs, the binary Agent24 really installs: the
# reproduced one for linux (identical to the asset), and for macOS the published signed
# asset downloaded from `release_url_base/version/assets.<platform>.name` and checked
# against `assets.<platform>.sha256`.
#
# Triggered on changes to the lock file itself, and also on changes to this
# workflow file — the latter so that the job actually *runs* (and so proves
# itself) the first time this workflow is introduced, rather than sitting
# dormant until some future, unrelated lock edit.
# CI also calls this workflow for linux-x64 and darwin-arm64.

on:
  push:
    branches: [main]
    paths:
      - 'rust/crates/agent24-comm/hyphae.lock.json'
      - '.github/workflows/hyphae-lock-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/crates/agent24-comm/hyphae.lock.json'
      - '.github/workflows/hyphae-lock-verify.yml'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      platform:
        description: Locked platform to reproduce
        type: string
        default: linux-x64

concurrency:
  group: hyphae-lock-verify-${{ github.workflow }}-${{ inputs.platform || 'linux-x64' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-x64:
    name: Reproduce Hyphae ${{ inputs.platform || 'linux-x64' }} and compare to lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYPHAE_PLATFORM: ${{ inputs.platform || 'linux-x64' }}

    steps:
      - name: Checkout Agent24 (for hyphae.lock.json)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          path: agent24
          submodules: false

      - name: Read hyphae.lock.json
        id: lock
        run: |
          set -euo pipefail
          case "$HYPHAE_PLATFORM" in
            linux-x64) GOOS=linux; GOARCH=amd64 ;;
            darwin-arm64) GOOS=darwin; GOARCH=arm64 ;;
            *) echo "::error::unsupported platform: $HYPHAE_PLATFORM"; exit 1 ;;
          esac
          LOCK=agent24/rust/crates/agent24-comm/hyphae.lock.json
          if [ "$(jq -r '.schema' "$LOCK")" != 2 ]; then
            echo "::error::hyphae.lock.json must be schema 2"
            exit 1
          fi
          SOURCE_SHA=$(jq -r '.source.commit' "$LOCK")
          VERSION=$(jq -r '.version' "$LOCK")
          ASSET_SHA=$(jq -r --arg p "$HYPHAE_PLATFORM" '.assets[$p].sha256 // empty' "$LOCK")
          ASSET_NAME=$(jq -r --arg p "$HYPHAE_PLATFORM" '.assets[$p].name // empty' "$LOCK")
          UNSIGNED_SHA=$(jq -r --arg p "$HYPHAE_PLATFORM" '.reproducible.unsigned_sha256[$p] // empty' "$LOCK")
          ASSET_URL="$(jq -r '.release_url_base | rtrimstr("/")' "$LOCK")/$VERSION/$ASSET_NAME"
          LOCK_GO=$(jq -r '.reproducible.toolchain' "$LOCK")
          RECIPE=$(jq -r '.reproducible.recipe' "$LOCK")
          case "$HYPHAE_PLATFORM" in
            # Unsigned platform: the published asset IS the reproduced build.
            linux-*)
              if [ "$UNSIGNED_SHA" != "$ASSET_SHA" ]; then
                echo "::error::unsigned $HYPHAE_PLATFORM: reproducible.unsigned_sha256 ($UNSIGNED_SHA) must equal assets sha256 ($ASSET_SHA)"
                exit 1
              fi
              EXPECTED=$ASSET_SHA ;;
            # Signed platform: reproduce the pre-signing bytes.
            darwin-*) EXPECTED=$UNSIGNED_SHA ;;
          esac
          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::hyphae.lock.json source.commit must be a full 40-character commit SHA"
            exit 1
          fi
          for value in "$EXPECTED" "$ASSET_SHA"; do
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::hyphae.lock.json has no valid $HYPHAE_PLATFORM sha256 (asset or unsigned)"
              exit 1
            fi
          done
          if ! printf '%s' "$LOCK_GO" | grep -Eq '^go[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::hyphae.lock.json has invalid go version: $LOCK_GO"
            exit 1
          fi
          if ! printf '%s' "$RECIPE" | grep -Fq "GOTOOLCHAIN=$LOCK_GO "; then
            echo "::error::recipe does not pin GOTOOLCHAIN to the lock's go version ($LOCK_GO)"
            exit 1
          fi
          if ! printf '%s' "$RECIPE" | grep -Fq -- "-X main.version=$VERSION"; then
            echo "::error::recipe does not inject the lock's version ($VERSION) via -X main.version"
            exit 1
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "go_version=${LOCK_GO#go}"
            echo "expected=$EXPECTED"
            echo "asset_sha=$ASSET_SHA"
            echo "asset_url=$ASSET_URL"
            echo "goos=$GOOS"
            echo "goarch=$GOARCH"
            echo "recipe<<HYPHAE_RECIPE_EOF"
            echo "$RECIPE"
            echo "HYPHAE_RECIPE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "locked source.commit=$SOURCE_SHA reproduce $HYPHAE_PLATFORM=$EXPECTED (asset $ASSET_SHA)"

      - name: Checkout Hyphae at the locked source.commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: iDoris-ai/Hyphae
          ref: ${{ steps.lock.outputs.source_sha }}
          path: hyphae-src
          submodules: false

      # Install the exact Go version declared in the lock; the recipe also
      # carries the matching GOTOOLCHAIN pin as a second check.
      - name: Setup locked Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: ${{ steps.lock.outputs.go_version }}

      - name: Build per the locked recipe
        working-directory: hyphae-src
        env:
          HYPHAE_RECIPE: ${{ steps.lock.outputs.recipe }}
          LOCK_GOOS: ${{ steps.lock.outputs.goos }}
          LOCK_GOARCH: ${{ steps.lock.outputs.goarch }}
        run: |
          set -euo pipefail
          # Substitute the recipe's own <os>/<arch> placeholders for this
          # one platform; everything else in the recipe string (including
          # its own GOTOOLCHAIN=... prefix) runs exactly as the lock wrote
          # it, so a future recipe edit is honored without touching this
          # workflow.
          cmd=$(printf '%s' "$HYPHAE_RECIPE" | sed -e "s/<os>/$LOCK_GOOS/g" -e "s/<arch>/$LOCK_GOARCH/g")
          echo "+ $cmd"
          sh -c "$cmd"
          test -f hyphae || { echo "::error::recipe did not produce ./hyphae"; exit 1; }

      - name: Compare reproduced sha256 to hyphae.lock.json
        env:
          EXPECTED: ${{ steps.lock.outputs.expected }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" = "null" ]; then
            echo "::error::hyphae.lock.json has no recorded $HYPHAE_PLATFORM reproduction hash"
            exit 1
          fi
          actual=$(sha256sum hyphae-src/hyphae | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual=$actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::$HYPHAE_PLATFORM build (sha256 $actual) does not reproduce hyphae.lock.json ($EXPECTED)"
            exit 1
          fi
          echo "$HYPHAE_PLATFORM reproducible build matches hyphae.lock.json ($actual)"

      # What the test jobs run must be what Agent24 installs: on a signed platform that
      # is the published signed asset, not the unsigned reproduction above.
      - name: Fetch the published signed asset
        if: startsWith(env.HYPHAE_PLATFORM, 'darwin-')
        env:
          ASSET_URL: ${{ steps.lock.outputs.asset_url }}
          ASSET_SHA: ${{ steps.lock.outputs.asset_sha }}
        run: |
          set -euo pipefail
          mkdir -p published
          curl -fsSL --proto '=https' --retry 3 -o published/hyphae "$ASSET_URL"
          printf '%s  %s\n' "$ASSET_SHA" published/hyphae | sha256sum --check
          echo "published $HYPHAE_PLATFORM asset matches hyphae.lock.json ($ASSET_SHA)"

      - name: Select the binary for the test jobs
        run: |
          set -euo pipefail
          mkdir -p verified
          case "$HYPHAE_PLATFORM" in
            darwin-*) cp published/hyphae verified/hyphae ;;
            *) cp hyphae-src/hyphae verified/hyphae ;;
          esac

      - name: Upload verified Hyphae
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hyphae-${{ env.HYPHAE_PLATFORM }}
          path: verified/hyphae
          if-no-files-found: error
