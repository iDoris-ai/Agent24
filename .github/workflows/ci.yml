name: CI

on:
  push:
    # ab/** 只走 pull_request（跑「task 分支 + 集成分支」的合并结果）；push 触发会对 task 分支本身单跑，
    # 集成分支后来补的修复（如 Rust 1.99 clippy）不在其中，留下一条永远红的检查，挡住 postreview 合并。
    branches: [main, m1-*, m2-*, m3-*]
  pull_request:
    branches: [main, m1-*, m2-*, m3-*, "ab/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filter for pull requests (push runs everything). Downstream jobs skip
  # with a job-level `if:` rather than workflow `paths:`: a job skipped by `if:`
  # reports Success to the required checks of the ab-integration ruleset, while
  # a workflow that never starts leaves them stuck at "Expected". Job display
  # names are what those required checks match; do not rename them.
  #
  # Fail closed: every downstream `if:` is
  #   !cancelled() && (needs.changes.result != 'success' || <output> == 'true')
  # so a failed `changes` job runs everything instead of skipping it green.
  # `!cancelled()` rather than `always()`: a run cancelled by the concurrency
  # group (a newer push) should not start the long jobs anyway. Unlike the
  # implicit success(), it also lets `rust` run (and fail at the Hyphae
  # download) when its Hyphae job failed, instead of being skipped as green.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      contract_rust: ${{ steps.filter.outputs.contract_rust }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      contract_node: ${{ steps.filter.outputs.contract_node }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false
          fetch-depth: 0
          filter: blob:none

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            printf '%s\n' rust=true contract_rust=true typecheck=true contract_node=true macos=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
          head -n 200 "$RUNNER_TEMP/changed.txt"
          bash .github/scripts/ci-changes.sh < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/filter.txt"
          rust=$(sed -n 's/^rust=//p' "$RUNNER_TEMP/filter.txt")
          # macOS jobs: only for PRs into main (and other non-ab/** bases);
          # ab/** task PRs rely on the developer's local macOS clippy, and the
          # integration PR into main runs them in full.
          case "$BASE_REF" in
            ab/*) macos=false ;;
            *) macos=$rust ;;
          esac
          echo "macos=$macos" >> "$RUNNER_TEMP/filter.txt"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/filter.txt"

  hyphae-linux-x64:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    uses: ./.github/workflows/hyphae-lock-verify.yml

  hyphae-darwin-arm64:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    uses: ./.github/workflows/hyphae-lock-verify.yml
    with:
      platform: darwin-arm64

  typecheck-test:
    name: Typecheck + Test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.typecheck == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false  # vendor/xiaoheishu unnecessary for CI

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        # Version from package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (skip Electron postinstall download)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: No direct model endpoints
        run: |
          node scripts/check-no-direct-model.mjs
          node scripts/check-no-direct-model.mjs --self-test

      - name: Typecheck
        run: pnpm typecheck && pnpm --filter @agent24/api-client typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # node:test scripts are not part of `pnpm test`. Signing cases that need
      # a real `codesign` skip themselves off darwin; the macOS job below runs
      # the same file so those cases actually execute.
      - name: Open Design component script tests
        working-directory: apps/desktop
        run: |
          pnpm test:pack-open-design
          pnpm test:stage-open-design
          pnpm test:open-design-mac-release

  rust:
    name: Rust (fmt + clippy + test)
    needs: [changes, hyphae-linux-x64]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    # Successful runs take 14–19 min; at 20 the post-job cache save was being
    # cancelled after every step had passed (2026-11-09: #1730, #1739).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # cargo metadata --no-deps only; fails before cache, fmt, and the long test run.
      - name: Layer dependency table drift
        run: python3 scripts/gen-layer-deps.py --check

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: No direct model endpoints
        run: |
          node scripts/check-no-direct-model.mjs
          node scripts/check-no-direct-model.mjs --self-test

      - name: fmt
        working-directory: rust
        run: cargo fmt --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download verified Hyphae linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: hyphae-linux-x64
          path: ${{ runner.temp }}/hyphae-linux-x64

      - name: Verify and enable Hyphae integration tests
        run: |
          set -euo pipefail
          expected=$(jq -er '.assets["linux-x64"].sha256' rust/crates/agent24-comm/hyphae.lock.json)
          bin="$RUNNER_TEMP/hyphae-linux-x64/hyphae"
          printf '%s  %s\n' "$expected" "$bin" | shasum -a 256 --check
          chmod +x "$bin"
          echo "HYPHAE_TEST_BIN=$bin" >> "$GITHUB_ENV"

      - name: test
        working-directory: rust
        run: cargo test --workspace -- --show-output

      # S1-7 gated dormant code behind features no default build turns on; keep it compiling (Linux job only).
      - name: dormant-workspace clippy (agent24-store)
        working-directory: rust
        run: cargo clippy -p agent24-store --features dormant-workspace --all-targets -- -D warnings

      - name: dormant-workspace test (agent24-store)
        working-directory: rust
        run: cargo test -p agent24-store --features dormant-workspace

      - name: knowledge-store clippy (agent24-knowledge)
        working-directory: rust
        run: cargo clippy -p agent24-knowledge --features knowledge-store --all-targets -- -D warnings

      - name: knowledge-store clippy (agent24d forwards the feature)
        working-directory: rust
        run: cargo clippy -p agent24d --features knowledge-store --all-targets -- -D warnings

      - name: knowledge-store test (agent24-knowledge)
        working-directory: rust
        run: cargo test -p agent24-knowledge --features knowledge-store --lib store::tests

      - name: Real Hyphae unlock
        working-directory: rust
        run: cargo test -p agent24-comm --test unlock_real_binary -- --ignored --nocapture

      - name: Events schema drift (Rust is the generation source since B4)
        working-directory: rust
        run: |
          cargo run -q -p agent24-protocol --bin export-schema > /tmp/events.schema.json
          diff /tmp/events.schema.json ../protocol/events.schema.json \
            || (echo "::error::protocol/events.schema.json is out of sync — run 'cargo run -p agent24-protocol --bin export-schema > ../protocol/events.schema.json' (from rust/) and commit" && exit 1)

      - name: License / bans check (cargo-deny)
        # Tag-pinned (org convention is sha-pinning; TODO pin sha once vetted)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check licenses bans sources

  rust-macos:
    name: Rust macOS (clippy + test)
    needs: [changes, hyphae-darwin-arm64]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    runs-on: macos-latest
    # Warm runs take 18–23 min. A cold cache (a dev-dependency feature change,
    # #1754) spent 26 min compiling before the first test, and a cancelled job
    # saves no cache, so a re-run would hit the same wall.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      - name: Rust toolchain
        # fmt is platform-independent and already enforced by the `rust` job on
        # ubuntu-latest, so this job only needs the clippy component.
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download verified Hyphae darwin-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: hyphae-darwin-arm64
          path: ${{ runner.temp }}/hyphae-darwin-arm64

      - name: Verify and enable Hyphae integration tests
        run: |
          set -euo pipefail
          expected=$(jq -er '.assets["darwin-arm64"].sha256' rust/crates/agent24-comm/hyphae.lock.json)
          bin="$RUNNER_TEMP/hyphae-darwin-arm64/hyphae"
          printf '%s  %s\n' "$expected" "$bin" | shasum -a 256 --check
          chmod +x "$bin"
          echo "HYPHAE_TEST_BIN=$bin" >> "$GITHUB_ENV"

      - name: test
        working-directory: rust
        run: cargo test --workspace -- --show-output

      - name: Real Hyphae unlock
        working-directory: rust
        run: cargo test -p agent24-comm --test unlock_real_binary -- --ignored --nocapture

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          # v5 auto-enables pnpm caching from package.json's packageManager,
          # but this job doesn't install pnpm; the signing test needs only node.
          package-manager-cache: false

      # Real codesign (dylib/node without entitlements, runtime flag, verify).
      # Ad-hoc Team ID injection is covered by the Linux script-test step.
      - name: Open Design macOS signing tests
        run: node --test apps/desktop/scripts/open-design-mac-release.test.mjs

  contract:
    name: Contract Tests + Codegen Drift
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contract_node == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: OpenAPI lint (redocly — structural/spec gate on protocol/openapi.yaml)
        run: pnpm lint:openapi

      - name: TUI coverage (every openapi operation is covered by the CLI or exempted — ADR-037)
        run: |
          node scripts/tui-coverage.mjs --self-test
          node scripts/tui-coverage.mjs

      - name: Codegen drift check (api-client must match protocol/)
        run: |
          pnpm gen:api
          STATUS=$(git status --porcelain --untracked-files=all -- packages/api-client/src)
          if [ -n "$STATUS" ]; then
            echo "::error::packages/api-client/src is out of sync with protocol/ — run 'pnpm gen:api' and commit"
            echo "$STATUS"
            exit 1
          fi
          EXPECTED=$'packages/api-client/src/events.d.ts\npackages/api-client/src/index.ts\npackages/api-client/src/openapi.d.ts'
          ACTUAL=$(git ls-files packages/api-client/src | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::unexpected tracked files under packages/api-client/src"
            diff <(echo "$EXPECTED") <(echo "$ACTUAL") || true
            exit 1
          fi

      - name: Build node daemon
        run: pnpm --filter @agent24/node-daemon build

      - name: Start daemon and wait for /health
        run: |
          node packages/node-daemon/dist/server.js > daemon.log 2>&1 &
          echo $! > daemon.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/api/v1/health

      - name: "Run contract tests (A24_EXPECT_LLM=down)"
        env:
          A24_EXPECT_LLM: down
        run: pnpm test:contract

      - name: Stop daemon
        if: always()
        run: if [ -f daemon.pid ]; then kill "$(cat daemon.pid)" 2>/dev/null || true; fi

      - name: Daemon log on failure
        if: failure()
        run: cat daemon.log || true

  contract-rust:
    name: Contract (agent24d)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contract_rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-contract-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Build agent24d
        working-directory: rust
        run: cargo build -p agent24d

      - name: Start agent24d and capture ready line
        run: |
          ./rust/target/debug/agent24d serve --port 0 > daemon.log 2>daemon.err &
          echo $! > daemon.pid
          for i in $(seq 1 240); do
            grep -q '"type":"ready"' daemon.log && break
            sleep 0.25
          done
          READY=$(grep '"type":"ready"' daemon.log | head -1)
          if [ -z "$READY" ]; then
            echo "::error::agent24d never printed a ready line within 60s"
            cat daemon.log daemon.err || true
            exit 1
          fi
          echo "ready line captured"
          echo "A24_BASE_URL=http://127.0.0.1:$(echo "$READY" | node -e 'process.stdin.once("data",d=>console.log(JSON.parse(d).port))')" >> "$GITHUB_ENV"
          echo "A24_TOKEN=$(echo "$READY" | node -e 'process.stdin.once("data",d=>console.log(JSON.parse(d).token))')" >> "$GITHUB_ENV"

      - name: "Run contract tests (target rust, A24_EXPECT_LLM=down)"
        env:
          A24_TARGET: rust
          A24_EXPECT_LLM: down
        run: pnpm test:contract

      - name: Stop daemon
        if: always()
        run: if [ -f daemon.pid ]; then kill "$(cat daemon.pid)" 2>/dev/null || true; fi

      - name: Daemon logs on failure
        if: failure()
        run: cat daemon.log daemon.err || true
