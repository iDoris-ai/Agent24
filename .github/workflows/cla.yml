# CLA Assistant GitHub Action
# Copy this file to: .github/workflows/cla.yml in each repo
#
# Prerequisites:
#   1. Go to repo Settings → Secrets → add secret named CLA_TOKEN
#      (a Personal Access Token with repo scope from an org admin account)
#   2. The CLA text lives at:
#      https://github.com/AAStarCommunity/Brood/blob/main/protocol/CLA.md
#
# Security note: this workflow runs in the base-repo context (pull_request_target)
# but does NOT checkout PR branch code, so contributor code never executes here
# and secrets are not exposed to external contributors.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write      # write signatures/cla.json to cla-signatures branch
  pull-requests: write # post CLA comment on PR
  statuses: write      # update PR commit status

jobs:
  cla-check:
    # issue_comment 对普通 issue 上的评论也会触发；action 只认 PR，拿不到 PR 就报错。
    # 只在 PR 事件、或评论落在 PR 上时才跑（contributor-assistant 官方推荐写法）。
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/AAStarCommunity/Brood/blob/main/protocol/CLA.md'
          branch: 'cla-signatures'
          allowlist: bot*,dependabot[bot],github-actions[bot]
          remote-organization-name: AAStarCommunity
          remote-repository-name: Brood
          # 合并后不锁 PR：集成分支上的 task PR 会在 CI 绿后先合并、再由 PR-Daemon 补评审（AGENTS.md 里程碑方向分支工作流），锁了评审就写不进去。
          lock-pullrequest-aftermerge: false
