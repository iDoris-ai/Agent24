name: Release Desktop (Linux + macOS)

# DEP-A6: desktop Linux packages (AppImage + deb), built on top of DEP-A3's
# CLI release pipeline (release.yml, #608/#609). DEP-B2 (owner decision
# 2026-10-05: ship a normal UNSIGNED macOS dmg now — no Apple Developer
# account is not a reason to wait) adds the macOS job below. This workflow
# never creates the GitHub Release itself (M5 in docs/Deployment/TASKS.md —
# A3 owns Release creation, this workflow only appends assets to the same
# tag) and never touches the SHA256SUMS file A3 produces (writes its own
# SHA256SUMS-desktop instead).
#
# macOS note (DEP-A10): the Open Design on-demand component also ships for
# macOS, reusing stage:open-design / rebuild:open-design-native / pack:open-
# design completely unmodified. tools-pack's `mac <action>` CLI has no `--to
# dir` target (only `all|app|dmg|zip`, see tools-pack/src/index.ts's
# TO_HELP_BY_PLATFORM) — but `--to app` (which maps to electron-builder's
# `dir` target under the hood) already produces the exact `app/ open-design/
# open-design-web-standalone/` layout those scripts expect: electron-builder's
# own `afterPack` hook copies the Next standalone web output into
# `open-design-web-standalone` for mac the same way it does for win, and
# `asar: false` keeps `app/` a loose, inspectable directory. So the "Build
# exact Open Design mac resource base" step below is the mac analogue of the
# Linux job's equivalent step, pointed at `Contents/Resources` instead of a
# Linux `--to dir` output — no new Agent24-side resource-assembly script was
# needed. Verified against a real build, not just unit tests: the real
# pipeline also needed two runtime fixes in src/main/{open-design-component,
# creative-serve-web}.ts (a tar listing exceeding Node's default execFile
# buffer, and a symlink so the Open Design fork's own launcher — which
# expects resourceRoot inside the app bundle — accepts the on-demand
# component's install directory outside it); both already landed via PR #670
# and apply to Linux too, not just mac.
#
# Same tag filter as release.yml — see that file's header comment for why
# `v[0-9]+.[0-9]+.[0-9]+` doesn't match `agent24-os-sdk-v9.9.9` / `v0.4.0-m4`.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true: 只构建并冒烟测试，不追加到 GitHub Release'
        type: boolean
        default: true
  # Builds + smoke-tests on a PR that touches this file, so the pipeline is
  # proven before merge (workflow_dispatch only sees the default branch).
  # The publish job never runs on pull_request (see its `if:`).
  pull_request:
    paths:
      - '.github/workflows/release-desktop.yml'
      - 'apps/desktop/package.json'
      - 'apps/desktop/scripts/prepare-open-design-linux-resources.mjs'
      - 'apps/desktop/scripts/rebuild-open-design-native.mjs'
      - 'apps/desktop/scripts/stage-open-design-resources.mjs'
      - 'apps/desktop/scripts/pack-open-design-component.mjs'
      - 'apps/desktop/scripts/ensure-open-design-component-dir.mjs'

permissions:
  contents: read

env:
  OPEN_DESIGN_SHA: f84ff89656143b5fa3fe8f0891b7f2bf38769d9f

concurrency:
  group: release-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + smoke test (linux x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      - name: Checkout exact reviewed Open Design fork
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: iDoris-ai/open-design-agent24
          ref: ${{ env.OPEN_DESIGN_SHA }}
          path: open-design

      - name: Setup Node.js for Open Design
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact Open Design Linux resource base
        shell: bash
        env:
          # Owner decision 2026-10-06 (DEP-A13): the fork's Linux assembly
          # step (tools/pack/src/linux.ts's runProductionInstall) defaults
          # to a plain `npm install --omit=dev`, which materializes a real,
          # byte-duplicated copy of every dependency shared across the 16
          # internal workspace packages it assembles (next/react/openai
          # etc. each ended up with several full copies) — measured at
          # 814MB shipped vs mac's 276MB for the exact same content. The
          # fork ALREADY supports routing this through pnpm itself
          # (`--config.node-linker=hoisted`, which still hard-links every
          # hoisted file back to pnpm's single content-addressable store
          # copy instead of duplicating bytes) via this env var — it was
          # built for the fork's own containerized Docker build, but
          # nothing about it requires a container; pnpm is already
          # corepack-activated on this runner by the time this step reaches
          # the tools-pack invocation below.
          OD_TOOLS_PACK_PNPM_BIN: pnpm
        run: |
          set -euo pipefail
          test "$(git -C open-design rev-parse HEAD)" = "$OPEN_DESIGN_SHA"
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          (
            cd open-design
            pnpm install --frozen-lockfile
            pnpm --filter @open-design/tools-pack dev linux build \
              --to dir \
              --portable \
              --namespace agent24-release \
              --dir "$RUNNER_TEMP/open-design-pack" \
              --json > "$RUNNER_TEMP/open-design-pack.json"
          )
          cat "$RUNNER_TEMP/open-design-pack.json"
          RESOURCE_PACKAGE="$(find "$RUNNER_TEMP/open-design-pack" -type f -path '*/resources/app/package.json' -print -quit)"
          test -n "$RESOURCE_PACKAGE"
          RESOURCE_DIR="$(dirname "$(dirname "$RESOURCE_PACKAGE")")"
          node apps/desktop/scripts/prepare-open-design-linux-resources.mjs \
            "$PWD/open-design" \
            "$RESOURCE_DIR"
          echo "A24_OPEN_DESIGN_RESOURCES_DIR=$RESOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Agent24 pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9.12.0

      - name: Setup Node.js for Agent24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Deliberately NOT setting ELECTRON_SKIP_BINARY_DOWNLOAD here (unlike
      # ci.yml) — electron-builder needs the real Electron binary to package
      # the AppImage/deb.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Build agent24d (release)
        working-directory: rust
        run: cargo build --release --bin agent24d

      - name: Build node-daemon
        run: pnpm --filter @agent24/node-daemon build

      - name: Build desktop renderer + electron main
        run: pnpm --filter @agent24/desktop build

      - name: Stage exact Open Design Creative resources
        run: pnpm --filter @agent24/desktop stage:open-design

      # Owner decision 2026-10-06 (DEP-A13): prune files from the staged
      # tree that are PROVABLY never loaded at runtime — conservative on
      # purpose (only categories we can actually justify, not everything
      # that LOOKS prunable):
      #   - "**/*.map" (source maps): Node's module loader never reads a
      #     .map file to execute the matching .js — these are consulted
      #     only by a debugger/devtools that explicitly asks for them,
      #     which nothing in this packaged, headless pipeline does.
      #     Measured on a real build: 377MB of these alone.
      #   - app/node_modules/@open-design/web's own {.next,src,public}:
      #     this package is only present in app/node_modules because the
      #     fork's own assembly step installs EVERY internal workspace
      #     package as a dependency of the packaged app regardless of
      #     whether anything actually requires it at runtime — and
      #     nothing does here. Confirmed by the fork's OWN prebundle
      #     policy (MAC_STANDALONE_PREBUNDLE_EXCLUDED_INTERNAL_PACKAGES /
      #     MAC_PREBUNDLE_POLICIES's forbiddenInputs in
      #     tools/pack/src/mac/prebundle.ts) explicitly asserting the
      #     prebundled daemon/web-sidecar entries never reference
      #     "/apps/web/" or "/node_modules/next/" as an input at all — the
      #     real, served web app is the SEPARATE, already self-contained
      #     open-design-web-standalone/ tree produced independently by
      #     stage-open-design-resources.mjs, not this copy.
      # package.json, dist/, LICENSE, and next.config.ts are left alone —
      # keeping anything we haven't specifically confirmed as dead weight.
      - name: Prune non-runtime files from the staged Open Design resource tree
        shell: bash
        run: |
          set -euo pipefail
          STAGE="apps/desktop/.open-design-resources"
          BEFORE="$(du -sh "$STAGE" | cut -f1)"
          find "$STAGE" -name '*.map' -delete
          rm -rf \
            "$STAGE/app/node_modules/@open-design/web/.next" \
            "$STAGE/app/node_modules/@open-design/web/src" \
            "$STAGE/app/node_modules/@open-design/web/public"
          AFTER="$(du -sh "$STAGE" | cut -f1)"
          echo "staged Open Design resource tree: $BEFORE -> $AFTER"

      - name: Rebuild Open Design native modules for Agent24 Electron
        env:
          A24_OPEN_DESIGN_SOURCE_DIR: ${{ github.workspace }}/open-design
        run: pnpm --filter @agent24/desktop rebuild:open-design-native

      # Owner decision 2026-10-05: Open Design must NOT be bundled in the
      # installer (it alone grew the AppImage from 146MB to 934MB, the deb
      # from 101MB to 622MB). This packs the staged+rebuilt tree from the
      # steps above into a downloadable asset and bakes only a small
      # manifest (open-design-component.json) into the app via
      # extraResources — see apps/desktop/src/main/open-design-component.ts,
      # the runtime installer that downloads it on first use of the Design
      # page.
      - name: Resolve app version (for the component manifest's download URL)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      # PR #670 review (C1): the tarball MUST NOT live in the same directory
      # electron-builder's extraResources bakes into the app
      # (.open-design-component/) — only the manifest belongs there. The
      # tarball goes to a separate .open-design-component-dist/ that nothing
      # in package.json's `build` config ever references.
      - name: Pack the Open Design on-demand component (tarball + manifest, in separate dirs)
        working-directory: apps/desktop
        env:
          A24_OD_STAGE_DIR: ${{ github.workspace }}/apps/desktop/.open-design-resources
          A24_OD_PACK_OUT_DIR: ${{ github.workspace }}/apps/desktop/.open-design-component
          A24_OD_TARBALL_OUT_DIR: ${{ github.workspace }}/apps/desktop/.open-design-component-dist
          A24_OD_APP_VERSION: ${{ steps.ver.outputs.version }}
          A24_OD_REPOSITORY: ${{ github.repository }}
          A24_OD_PLATFORM: linux
          A24_OD_ARCH: x64
        run: pnpm pack:open-design

      - name: 'electron-builder (Linux: AppImage + deb)'
        run: pnpm --filter @agent24/desktop exec electron-builder --linux AppImage deb

      - name: Verify Open Design is NOT bundled — only the component manifest is
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(realpath "$(ls release/*.AppImage)")"
          DEB="$(realpath "$(ls release/*.deb)")"
          VERIFY_ROOT="$RUNNER_TEMP/desktop-package-verify"
          rm -rf "$VERIFY_ROOT"
          mkdir -p "$VERIFY_ROOT/appimage" "$VERIFY_ROOT/deb"

          (
            cd "$VERIFY_ROOT/appimage"
            chmod +x "$APPIMAGE"
            "$APPIMAGE" --appimage-extract >/dev/null
          )
          dpkg-deb -x "$DEB" "$VERIFY_ROOT/deb"

          verify_on_demand_only() {
            local package_root="$1"
            local manifest
            manifest="$(find "$package_root" -type f -path '*/resources/open-design-component.json' -print -quit)"
            test -n "$manifest"
            test "$(jq -r '.version' "$manifest")" = "0.22.2"
            test "$(jq -r '.odSha' "$manifest")" = "$OPEN_DESIGN_SHA"
            test "$(jq -r '.platform' "$manifest")" = "linux"
            test "$(jq -r '.arch' "$manifest")" = "x64"
            local resources
            resources="$(dirname "$manifest")"
            test ! -e "$resources/app"
            test ! -e "$resources/open-design"
            test ! -e "$resources/open-design-web-standalone"
            # C1: the manifest dir must hold ONLY the manifest — no tarball
            # anywhere under resources/ (the actual bug this PR had: packing
            # the tarball into the same dir extraResources bundles).
            # L1 (review finding, 2026-10-05): no -maxdepth here — a tarball
            # nested a level or two down (e.g. under resources/app/) would
            # have been just as real a regression and the old -maxdepth 1
            # silently never looked for it.
            if find "$resources" -name '*.tar.gz' -print | grep -q .; then
              echo "::error::found a .tar.gz bundled inside $resources — the on-demand component must never ship inside the installer"
              find "$resources" -name '*.tar.gz'
              exit 1
            fi
          }

          verify_on_demand_only "$VERIFY_ROOT/appimage/squashfs-root"
          verify_on_demand_only "$VERIFY_ROOT/deb"

          # Size caps: catch a future regression that re-bundles Open Design
          # (or anything else large) long before someone has to notice a
          # 900MB AppImage by eye. 250MB is comfortably above today's
          # ~146MB/~101MB on-demand-split baseline with headroom for normal
          # dependency growth.
          MAX_INSTALLER_BYTES=$((250 * 1024 * 1024))
          for installer in "$APPIMAGE" "$DEB"; do
            size="$(stat -c%s "$installer" 2>/dev/null || stat -f%z "$installer")"
            echo "$(basename "$installer"): $size bytes"
            if [ "$size" -gt "$MAX_INSTALLER_BYTES" ]; then
              echo "::error::$(basename "$installer") is $size bytes, over the $MAX_INSTALLER_BYTES byte cap — Open Design (or something else large) may have been re-bundled"
              exit 1
            fi
          done

      - name: Smoke test — Open Design component tarball extracts and passes the staging contract
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(ls .open-design-component-dist/open-design-*.tar.gz)"
          EXTRACT="$RUNNER_TEMP/od-component-smoke"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          tar -xzf "$TARBALL" -C "$EXTRACT"
          test -d "$EXTRACT/app"
          test -d "$EXTRACT/open-design"
          test -d "$EXTRACT/open-design-web-standalone"
          test "$(jq -r '.version' "$EXTRACT/app/package.json")" = "0.22.2"
          for relative in \
            app/prebundled/agent24-headless.cjs \
            app/prebundled/agent24-headless.mjs \
            app/prebundled/daemon/daemon-cli.mjs \
            app/prebundled/daemon/daemon-sidecar.mjs \
            app/prebundled/web-sidecar.mjs; do
            test -f "$EXTRACT/$relative"
          done
          if find "$EXTRACT" -type l -lname '/*' | grep -q .; then
            echo "::error::Open Design component tarball contains an absolute symlink"
            find "$EXTRACT" -type l -lname '/*'
            exit 1
          fi

      # M2 (review finding, 2026-10-05): every check above only proves the
      # shipped tarball LOOKS right — nothing before this point ever
      # actually installs it through the real installer into the real
      # default ~/.agent24/components/open-design/ and launches it through
      # the real packaged Electron binary. See scripts/ci-on-demand-
      # smoke.mjs's own header comment for exactly what this does and does
      # not prove (short version: it proves Agent24's own on-demand runtime
      # integration end to end; it stands in for the fork's own
      # agent24-headless.cjs with a local fixture launcher because the
      # officially pinned Open Design commit doesn't speak protocol v2 yet
      # — that's covered by the fork PR's own test suite instead).
      - name: 'M2: on-demand install (real installer, real default dir) -> real packaged launch -> /api/ready'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE_ROOT="$RUNNER_TEMP/desktop-package-verify/appimage/squashfs-root"
          test -d "$APPIMAGE_ROOT"
          # AppRun is electron-builder's own generated wrapper SCRIPT (not a
          # symlink to the binary — real run, 2026-10-05: it failed with
          # "/agent24-desktop: No such file or directory" because it
          # resolves its own binary's location relative to $APPDIR, which
          # is only set when actually launched through the AppImage FUSE
          # mount, not when run directly from this extracted squashfs-root).
          # The real binary sits at the top of squashfs-root, named after
          # package.json's build.linux.executableName.
          EXECUTABLE_NAME="$(jq -r '.build.linux.executableName' package.json)"
          RUNTIME_EXECUTABLE="$APPIMAGE_ROOT/$EXECUTABLE_NAME"
          test -x "$RUNTIME_EXECUTABLE"
          A24_SMOKE_RUNTIME_EXECUTABLE="$RUNTIME_EXECUTABLE" node scripts/ci-on-demand-smoke.mjs

      - name: List packaged artifacts (installer size reduction vs. the previous bundled build)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          ls -la release/*.AppImage release/*.deb .open-design-component-dist/open-design-*.tar.gz
          echo "--- sizes ---"
          du -h release/*.AppImage release/*.deb .open-design-component-dist/open-design-*.tar.gz

      - name: Install xvfb (for the AppImage smoke test)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Smoke test — AppImage boots sidecar, /health is 200
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(ls release/*.AppImage)"
          chmod +x "$APPIMAGE"

          SMOKE_HOME="$RUNNER_TEMP/a6-smoke-home"
          rm -rf "$SMOKE_HOME"
          mkdir -p "$SMOKE_HOME"
          export HOME="$SMOKE_HOME"

          xvfb-run -a "$APPIMAGE" --appimage-extract-and-run --no-sandbox \
            > "$RUNNER_TEMP/appimage.log" 2>&1 &
          LAUNCHER_PID=$!
          echo "launcher pid: $LAUNCHER_PID"

          STATE="$SMOKE_HOME/.agent24/daemon.json"
          for _ in $(seq 1 60); do
            [ -f "$STATE" ] && break
            sleep 1
          done
          if [ ! -f "$STATE" ]; then
            echo "::error::daemon.json did not appear under \$HOME/.agent24 within 60s"
            cat "$RUNNER_TEMP/appimage.log" || true
            kill "$LAUNCHER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "daemon.json:"; cat "$STATE"

          PORT="$(jq -r '.port' "$STATE")"
          SIDECAR_PID="$(jq -r '.pid' "$STATE")"

          BODY="$RUNNER_TEMP/health.json"
          STATUS="$(curl -s -o "$BODY" -w '%{http_code}' "http://127.0.0.1:$PORT/api/v1/health")"
          echo "health status: $STATUS body: $(cat "$BODY")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::health check returned $STATUS instead of 200"
            kill "$SIDECAR_PID" "$LAUNCHER_PID" 2>/dev/null || true
            exit 1
          fi

          # RESEARCH.md §4 risk: AppRun may inject LD_LIBRARY_PATH into every
          # child it spawns, including the agent24d sidecar (and whatever it
          # spawns in turn, e.g. shell_exec / modules). Flag it as a warning
          # and document it in the PR — fixing it is explicitly out of scope
          # for DEP-A6.
          if [ -r "/proc/$SIDECAR_PID/environ" ] && \
             tr '\0' '\n' < "/proc/$SIDECAR_PID/environ" | grep -q '^LD_LIBRARY_PATH='; then
            echo "::warning::AppImage-injected LD_LIBRARY_PATH leaked into the agent24d sidecar (pid $SIDECAR_PID) — not fixed in DEP-A6, see docs/Deployment/RESEARCH.md §4"
            tr '\0' '\n' < "/proc/$SIDECAR_PID/environ" | grep '^LD_LIBRARY_PATH=' || true
          else
            echo "no LD_LIBRARY_PATH leak observed in the sidecar environment"
          fi

          kill "$SIDECAR_PID" 2>/dev/null || true
          kill "$LAUNCHER_PID" 2>/dev/null || true

      - name: Smoke test — deb installs and contains agent24d
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(ls release/*.deb)"
          PKG="$(dpkg-deb -f "$DEB" Package)"
          echo "package name: $PKG"

          sudo apt-get update -qq && sudo apt-get install -y "$(realpath "$DEB")"  # apt resolves declared deps (e.g. libnotify4), as users would
          dpkg -L "$PKG" | tee "$RUNNER_TEMP/deb-contents.txt"
          if ! grep -q 'agent24d$' "$RUNNER_TEMP/deb-contents.txt"; then
            echo "::error::agent24d binary not found in installed deb contents"
            sudo dpkg -r "$PKG" || true
            exit 1
          fi
          sudo dpkg -r "$PKG"

      - name: Copy the Open Design component tarball next to the installers
        # upload-artifact flattens multi-path uploads relative to their
        # greatest common ancestor — keeping everything under
        # apps/desktop/release/ here is what keeps the publish job's
        # `dist/*.AppImage dist/*.deb dist/open-design-*.tar.gz` flat globs
        # working, same as before this tarball existed.
        run: cp apps/desktop/.open-design-component-dist/open-design-*.tar.gz apps/desktop/release/

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/open-design-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build + smoke test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # Current standard Intel macOS runner label (same source as
          # release.yml's comment, fetched 2026-10-01): macos-13 is retired.
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false

      # DEP-A10: mac DOES get an on-demand Open Design component after all —
      # research (see this file's header comment) found that tools-pack's
      # `mac build --to app` target already produces the exact
      # `app/ open-design/ open-design-web-standalone/` layout Agent24's
      # EXISTING stage/rebuild/pack scripts expect (electron-builder's own
      # `afterPack` hook copies the Next standalone web output into
      # `open-design-web-standalone` for mac too, same as it does for win —
      # `asar: false` keeps `app/` a loose, inspectable directory). So this
      # reuses stage:open-design / rebuild:open-design-native / pack:open-
      # design completely unmodified, just pointed at the mac build's
      # Contents/Resources directory instead of a Linux `--to dir` output.
      - name: Checkout exact reviewed Open Design fork
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          repository: iDoris-ai/open-design-agent24
          ref: ${{ env.OPEN_DESIGN_SHA }}
          path: open-design

      - name: Setup Node.js for Open Design
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact Open Design mac resource base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C open-design rev-parse HEAD)" = "$OPEN_DESIGN_SHA"
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          (
            cd open-design
            pnpm install --frozen-lockfile
            pnpm --filter @open-design/tools-pack dev mac build \
              --to app \
              --portable \
              --namespace agent24-release \
              --dir "$RUNNER_TEMP/open-design-pack" \
              --json > "$RUNNER_TEMP/open-design-pack.json"
          )
          cat "$RUNNER_TEMP/open-design-pack.json"
          RESOURCE_PACKAGE="$(find "$RUNNER_TEMP/open-design-pack" -type f -path '*/Contents/Resources/app/package.json' -print -quit)"
          test -n "$RESOURCE_PACKAGE"
          RESOURCE_DIR="$(dirname "$(dirname "$RESOURCE_PACKAGE")")"
          echo "A24_OPEN_DESIGN_RESOURCES_DIR=$RESOURCE_DIR" >> "$GITHUB_ENV"

      - name: Setup Agent24 pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: 9.12.0

      - name: Setup Node.js for Agent24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-desktop-macos-${{ matrix.arch }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Build agent24d (release)
        working-directory: rust
        run: cargo build --release --bin agent24d

      - name: Self-check — binary architecture
        shell: bash
        run: |
          set -euo pipefail
          file rust/target/release/agent24d
          archs="$(lipo -archs rust/target/release/agent24d)"
          echo "archs: $archs"
          case "${{ matrix.arch }}" in
            arm64) echo "$archs" | grep -qw arm64 ;;
            x64)   echo "$archs" | grep -qw x86_64 ;;
          esac

      - name: Build node-daemon
        run: pnpm --filter @agent24/node-daemon build

      - name: Build desktop renderer + electron main
        # ensure-open-design-component-dir.mjs (chained into this script)
        # guarantees .open-design-component/ exists even before the pack
        # step below runs, same as the Linux job.
        run: pnpm --filter @agent24/desktop build

      - name: Stage exact Open Design Creative resources
        run: pnpm --filter @agent24/desktop stage:open-design

      - name: Rebuild Open Design native modules for Agent24 Electron
        env:
          A24_OPEN_DESIGN_SOURCE_DIR: ${{ github.workspace }}/open-design
        run: pnpm --filter @agent24/desktop rebuild:open-design-native

      - name: Resolve app version (for the component manifest's download URL)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the Open Design on-demand component (tarball + manifest, in separate dirs)
        working-directory: apps/desktop
        env:
          A24_OD_STAGE_DIR: ${{ github.workspace }}/apps/desktop/.open-design-resources
          A24_OD_PACK_OUT_DIR: ${{ github.workspace }}/apps/desktop/.open-design-component
          A24_OD_TARBALL_OUT_DIR: ${{ github.workspace }}/apps/desktop/.open-design-component-dist
          A24_OD_APP_VERSION: ${{ steps.ver.outputs.version }}
          A24_OD_REPOSITORY: ${{ github.repository }}
          A24_OD_PLATFORM: darwin
          A24_OD_ARCH: ${{ matrix.arch }}
        run: pnpm pack:open-design

      # H3 (review finding, 2026-10-05): the previous order built the dmg
      # FIRST (`--mac dmg`) and only ad-hoc signed the leftover unpacked
      # .app in release/mac* AFTER — a copy that was never the one sealed
      # into the dmg. Whatever signature (or lack of one) electron-builder's
      # own packaging already produced is what actually shipped; the manual
      # signing step below ran too late to change it. Correct order: build
      # the unpacked .app only (`--mac dir`), sign THAT, then pack the
      # already-signed app into a dmg via `--prepackaged` (which does not
      # rebuild the app — it just wraps the given, already-signed, bundle).
      - name: 'electron-builder (macOS: build unsigned .app, dir target only)'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dir

      - name: Ad-hoc sign the .app so it launches on this architecture
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          APP="$(realpath "$(find release -maxdepth 2 -name '*.app' -print -quit)")"
          test -n "$APP"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP"
          # Absolute: M2's smoke-test step below reads this from a
          # DIFFERENT working directory context and requires an absolute
          # path (a relative one broke CI — 2026-10-05 real run).
          echo "A24_SIGNED_APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: 'electron-builder (macOS: pack the SIGNED .app into a dmg)'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --prepackaged "$A24_SIGNED_APP_PATH" --mac dmg

      - name: Smoke test — mount dmg, check codesign, run bundled agent24d, /health is 200, no Open Design trees
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(ls release/*.dmg)"
          MOUNT_ROOT="$RUNNER_TEMP/a24-dmg-mount"
          mkdir -p "$MOUNT_ROOT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_ROOT" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_ROOT" -quiet || true' EXIT

          APP="$(find "$MOUNT_ROOT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign -dv "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.log"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.log"
          # H3 (review finding, 2026-10-05): -dv only prints whatever
          # signature metadata is embedded; it does not check that the
          # signature actually matches the bundle's current on-disk
          # contents. --verify re-hashes everything the signature covers
          # and fails loudly on any mismatch — the real proof that the app
          # mounted from the dmg is the one that was signed, not a stale or
          # tampered copy sealed in by a build step that ran out of order.
          codesign --verify --deep --strict "$APP"

          RESOURCES="$APP/Contents/Resources"
          test ! -e "$RESOURCES/open-design"
          test ! -e "$RESOURCES/open-design-web-standalone"
          test ! -e "$RESOURCES/app"
          # L1 (review finding, 2026-10-05): no -maxdepth here either — see
          # the matching Linux-job comment above.
          if find "$RESOURCES" -name '*.tar.gz' -print | grep -q .; then
            echo "::error::found a .tar.gz bundled inside $RESOURCES — the on-demand component must never ship inside the installer"
            exit 1
          fi

          MANIFEST="$RESOURCES/open-design-component.json"
          test -f "$MANIFEST"
          test "$(jq -r '.version' "$MANIFEST")" = "0.22.2"
          test "$(jq -r '.odSha' "$MANIFEST")" = "$OPEN_DESIGN_SHA"
          test "$(jq -r '.platform' "$MANIFEST")" = "darwin"
          test "$(jq -r '.arch' "$MANIFEST")" = "${{ matrix.arch }}"

          MAX_INSTALLER_BYTES=$((250 * 1024 * 1024))
          DMG_SIZE="$(stat -f%z "$DMG")"
          echo "$(basename "$DMG"): $DMG_SIZE bytes"
          if [ "$DMG_SIZE" -gt "$MAX_INSTALLER_BYTES" ]; then
            echo "::error::$(basename "$DMG") is $DMG_SIZE bytes, over the $MAX_INSTALLER_BYTES byte cap — Open Design (or something else large) may have been re-bundled"
            exit 1
          fi

          AGENT24D="$RESOURCES/backend/agent24d"
          test -x "$AGENT24D"
          SMOKE_HOME="$RUNNER_TEMP/a-b2-smoke-home"
          rm -rf "$SMOKE_HOME"
          mkdir -p "$SMOKE_HOME"
          HOME="$SMOKE_HOME" "$AGENT24D" serve --port 0 &
          AGENT_PID=$!

          STATE="$SMOKE_HOME/.agent24/daemon.json"
          for _ in $(seq 1 60); do
            [ -f "$STATE" ] && break
            sleep 1
          done
          if [ ! -f "$STATE" ]; then
            echo "::error::daemon.json did not appear under \$HOME/.agent24 within 60s"
            kill "$AGENT_PID" 2>/dev/null || true
            exit 1
          fi
          echo "daemon.json:"; cat "$STATE"

          PORT="$(jq -r '.port' "$STATE")"
          BODY="$RUNNER_TEMP/health.json"
          STATUS="$(curl -s -o "$BODY" -w '%{http_code}' "http://127.0.0.1:$PORT/api/v1/health")"
          echo "health status: $STATUS body: $(cat "$BODY")"
          kill "$AGENT_PID" 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "::error::health check returned $STATUS instead of 200"
            exit 1
          fi

      - name: Smoke test — Open Design darwin component tarball extracts and passes the staging contract
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(ls .open-design-component-dist/open-design-*.tar.gz)"
          EXTRACT="$RUNNER_TEMP/od-component-smoke"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          tar -xzf "$TARBALL" -C "$EXTRACT"
          test -d "$EXTRACT/app"
          test -d "$EXTRACT/open-design"
          test -d "$EXTRACT/open-design-web-standalone"
          test "$(jq -r '.version' "$EXTRACT/app/package.json")" = "0.22.2"
          for relative in \
            app/prebundled/agent24-headless.cjs \
            app/prebundled/agent24-headless.mjs \
            app/prebundled/daemon/daemon-cli.mjs \
            app/prebundled/daemon/daemon-sidecar.mjs \
            app/prebundled/web-sidecar.mjs; do
            test -f "$EXTRACT/$relative"
          done
          if find "$EXTRACT" -type l -lname '/*' | grep -q .; then
            echo "::error::Open Design darwin component tarball contains an absolute symlink"
            find "$EXTRACT" -type l -lname '/*'
            exit 1
          fi

      # M2 (review finding, 2026-10-05): see the matching Linux-job comment
      # above for what this does and does not prove. Reuses the already-
      # signed .app from the "Ad-hoc sign" step directly (its own env var,
      # not the dmg-mounted copy — that one gets unmounted by that step's
      # own EXIT trap before this step runs; its signature is already
      # proven by the codesign --verify smoke test above).
      - name: 'M2: on-demand install (real installer, real default dir) -> real packaged launch -> /api/ready'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${A24_SIGNED_APP_PATH:-}"
          RUNTIME_EXECUTABLE="$(find "$A24_SIGNED_APP_PATH/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -x "$RUNTIME_EXECUTABLE"
          A24_SMOKE_RUNTIME_EXECUTABLE="$RUNTIME_EXECUTABLE" node scripts/ci-on-demand-smoke.mjs

      - name: Report dmg + Open Design tarball sizes
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          ls -la release/*.dmg .open-design-component-dist/open-design-*.tar.gz
          echo "--- sizes ---"
          du -h release/*.dmg .open-design-component-dist/open-design-*.tar.gz

      - name: Copy the Open Design component tarball next to the dmg
        # Same reasoning as the Linux job: upload-artifact flattens
        # multi-path uploads relative to their greatest common ancestor.
        run: cp apps/desktop/.open-design-component-dist/open-design-*.tar.gz apps/desktop/release/

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/open-design-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Append to Release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    permissions:
      contents: write
    steps:
      - name: Download artifacts (Linux + both macOS architectures)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Checksums (separate file — A3 owns SHA256SUMS)
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          shasum -a 256 -- *.AppImage *.deb *.dmg open-design-*.tar.gz > SHA256SUMS-desktop
          cat SHA256SUMS-desktop
          shasum -a 256 -c SHA256SUMS-desktop

      # M5 in docs/Deployment/TASKS.md: release.yml (A3) creates the Release
      # on the same tag; the two workflows run in parallel off the same push,
      # so this one may reach here before A3's "release" job has created it.
      # Poll instead of failing immediately: up to 30 minutes, every 30s.
      - name: Wait for the A3 Release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "waiting for release $TAG (created by release.yml / DEP-A3)..."
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG found after $(( (i - 1) * 30 ))s"
              exit 0
            fi
            sleep 30
          done
          echo "::error::release $TAG was not created within 30 minutes — release.yml (DEP-A3) may have failed or not run"
          exit 1

      - name: Upload desktop assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            dist/*.AppImage dist/*.deb dist/*.dmg dist/open-design-*.tar.gz dist/SHA256SUMS-desktop \
            --clobber
