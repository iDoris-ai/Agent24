name: Sidecar Cross-Platform

on:
  pull_request:
    paths:
      - "rust/apps/agent24-sidecar-host/**"
      - "rust/crates/agent24-sidecar-host-protocol/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/sidecar-windows.yml"

permissions:
  contents: read

concurrency:
  group: sidecar-cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust sidecar host + protocol (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-sidecar-${{ matrix.os }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}

      - name: fmt
        working-directory: rust
        run: cargo fmt --check --package agent24-sidecar-host --package agent24-sidecar-host-protocol

      - name: check
        working-directory: rust
        run: cargo check --locked -p agent24-sidecar-host -p agent24-sidecar-host-protocol

      - name: test
        working-directory: rust
        run: cargo test --locked -p agent24-sidecar-host -p agent24-sidecar-host-protocol

      - name: Windows descendant lifecycle test (isolated)
        if: runner.os == 'Windows'
        working-directory: rust
        run: cargo test --locked -p agent24-sidecar-host native_harness_tests::leader_exit_with_live_descendant_forces_tree_to_confirmed_empty -- --exact --ignored --nocapture

      - name: ProcessKit PK4 isolated-pipe evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = '60aa827db378daa5b1ec638f3b3fdaaf9c201560'
          $checkout = Join-Path $env:RUNNER_TEMP 'processkit-pk4'
          git clone --filter=blob:none https://github.com/jhfnetboy/ProcessKit-rs.git $checkout
          Set-Location $checkout
          git checkout --detach $pin
          if ((git rev-parse HEAD).Trim() -ne $pin) {
            throw 'ProcessKit checkout did not resolve to the pinned revision'
          }
          rustc -Vv
          cargo -V
          cargo test --locked --all-features --lib sys::windows_piped::tests:: -- --ignored --nocapture

      - name: clippy
        working-directory: rust
        run: cargo clippy --locked -p agent24-sidecar-host -p agent24-sidecar-host-protocol --all-targets -- -D warnings
