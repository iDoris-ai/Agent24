      description: >-
        Idempotent on `Idempotency-Key` (kind `upload`, §5.4): the same key
        with the same body returns the existing upload; with a different
        body, `idempotency_key_reused`.
      parameters:
        - $ref: "#/components/parameters/DocumentsIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentsUploadRequest" }
      responses:
        "200":
          description: Replay of an existing upload with the same key and body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsUpload" }
        "201":
          description: Upload created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsUpload" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "422": { $ref: "#/components/responses/DocumentsUploadUnprocessable" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/uploads/{upload_id}/chunks:
    post:
      operationId: documentsAppendUploadChunk
      tags: [documents]
      summary: Append one chunk of raw bytes at the given offset
      description: >-
        At most 786432 bytes (768 KiB) of raw body per chunk, counted in
        bytes by the OS, leaving room under the 1 MiB proxy body limit. An
        offset equal to the bytes received so far appends; a chunk already
        received with the same hash is a 200 replay; anything else is
        `upload_offset_mismatch` with `details.received_offset` (§5.6). The
        checks run in that order: for a new chunk (offset equal to the bytes
        received so far), a `Chunk-Sha256` that does not match the body's
        bytes is 400 `invalid_request`; for a range already received, any
        hash other than the stored one is the 409 above, as §5.6 requires.
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
        - name: Chunk-Sha256
          in: header
          required: true
          schema: { $ref: "#/components/schemas/Sha256Address" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 786432 }
      responses:
        "200":
          description: The upload after this chunk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsUpload" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "409": { $ref: "#/components/responses/DocumentsConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/imports:
    post:
      operationId: documentsImport
      tags: [documents]
      summary: Import a completed upload as a new document (r1); starts a job
      description: >-
        Page-only in DOC-1 (Q4): not announced as an agent tool. Idempotent on
        `upload_id` (kind `import`, §5.4, §7): a repeat returns the same job —
        202 while it is queued or running, and 202 again when a failed or
        interrupted job is re-queued (same job_id, attempt + 1); 200 once it
        has succeeded (with `result`) or was cancelled (it stays cancelled;
        only `POST /jobs/{job_id}/retry` restarts it). An upload that is not
        complete is 400 `invalid_request` with `details.received`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentsImportRequest" }
      responses:
        "200":
          description: Replay of a job that already succeeded or was cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsJob" }
        "202":
          description: The import job, new, still running, or re-queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsJob" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "422": { $ref: "#/components/responses/DocumentsImportUnprocessable" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/jobs/{job_id}:
    get:
      operationId: documentsGetJob
      tags: [documents]
      summary: Get a job; the row, not any event, is the authority (§7)
      description: >-
        One job, not paginated. A job's result, when it is a collection (e.g.
        extraction values), is paginated by its own resource (ADR-DOC-02 §4).
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsJob" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/jobs/{job_id}/cancel:
    post:
      operationId: documentsCancelJob
      tags: [documents]
      summary: Cancel a job (idempotent); a cancelled job is never revived by a replay
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job, now cancelling, cancelled, or already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsJob" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/jobs/{job_id}/retry:
    post:
      operationId: documentsRetryJob
      tags: [documents]
      summary: Explicitly restart a failed, interrupted or cancelled job (attempt + 1)
      description: >-
        A job that is queued, running, cancelling or succeeded cannot be
        retried: 400 `invalid_request` with `details.status`.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job, queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentsJob" }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

  /documents/documents/{document_id}/revisions/{revision}/pages/{page}:
    get:
      operationId: documentsRenderPage
      tags: [documents]
      summary: Render one page of a revision as PNG (ADR-DOC-02 §4)
      description: >-
        The image is at most 1 MiB. The OS lowers `scale` until it fits and
        reports the scale it used in `Documents-Render-Scale`. If the
        requested area does not fit even at scale 0.25, the response is 413
        `payload_too_large`: request smaller tiles with `region`. Renders are
        a cache derived from the revision and can be rebuilt (§3).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/RevisionNumber"
        - name: page
          in: path
          required: true
          description: 1-based physical page.
          schema: { type: integer, minimum: 1 }
        - name: scale
          in: query
          required: false
          schema: { type: number, minimum: 0.25, maximum: 4, default: 1 }
        - name: region
          in: query
          required: false
          description: >-
            `x,y,width,height` in CropBox points, origin at the top-left of the
            displayed (rotated) page — the same frame as anchor geometry.
            Width and height must be greater than 0; an empty or off-page
            region is 400 `invalid_request`.
          schema:
            type: string
            pattern: "^[0-9]+(\\.[0-9]+)?(,[0-9]+(\\.[0-9]+)?){3}$"
      responses:
        "200":
          description: The rendered page or region
          headers:
            Documents-Render-Scale:
              description: The scale actually used, at most the one requested.
              required: true
              schema: { type: number, minimum: 0.25, maximum: 4 }
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/DocumentsBadRequest" }
        "404": { $ref: "#/components/responses/DocumentsNotFound" }
        "413": { $ref: "#/components/responses/DocumentsTooLarge" }
        "422": { $ref: "#/components/responses/DocumentsRenderUnprocessable" }
        "500": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "502": { $ref: "#/components/responses/DocumentsProxyFailure" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
        "504": { $ref: "#/components/responses/DocumentsProxyFailure" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Token from the agent24d stdout ready line
        (`{"type":"ready","port":…,"token":"…"}`). The M-A mock daemon accepts
        an empty token; agent24d requires a non-empty one and rejects WebSocket
        upgrades that carry a browser Origin header.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DocumentIdString" }
    DocumentsCursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` from the previous page (ADR-DOC-02 §4).
      schema: { type: string }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, pattern: "^upl_[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/JobIdString" }
    DocumentsIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key; reused on retry after an unknown outcome (§5.5).
      schema: { type: string, minLength: 1, maxLength: 200 }
    RevisionNumber:
      name: revision
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DocumentsLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Internal:
      description: "internal: the request could not be completed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "payload_too_large: the request exceeded the daemon-wide body limit"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "invalid_request: malformed or invalid request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Sin90Unavailable:
      description: The Sin90 module store failed to open; the kernel is unaffected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "not_found: resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: No LLM provider reachable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DocumentsBadRequest:
      description: >-
        `invalid_request` from the OS (DocumentsError, with details), or
        `invalid_request` / `invalid_request_path` from the kernel proxy (no
        details).
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/DocumentsInvalidRequestError"
              - allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties: { code: { enum: [invalid_request, invalid_request_path] }, details: false }
    DocumentsNotFound:
      description: >-
        `not_found`: the document, revision, job or upload does not exist or
        has expired (DocumentsError), or the kernel has no such route
        (generic Error).
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/DocumentsNotFoundError"
              - allOf:
                  - $ref: "#/components/schemas/Error"
                  - properties:
                      error:
                        properties: { code: { enum: [not_found] }, details: false }
    DocumentsConflict:
      description: "`upload_offset_mismatch` with `details.received_offset` (§5.6)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentsConflictError" }
    DocumentsTooLarge:
      description: "`payload_too_large`: the render does not fit in 1 MiB even at scale 0.25; request a smaller `region`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentsTooLargeError" }
    DocumentsRenderUnprocessable:
      description: "`unsupported_format` or `parse_failed` (§6); render has no `require_complete`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentsRenderUnprocessableError" }
    DocumentsUploadUnprocessable:
      description: "`idempotency_key_reused`: the same key with a different body (§5.4)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentsUploadUnprocessableError" }
    DocumentsImportUnprocessable:
      description: >-
        `idempotency_key_reused`, `upload_checksum_mismatch` (whole-file hash
        checked at import, §5.6) or `unsupported_format`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocumentsImportUnprocessableError" }
    DocumentsUnavailable:
      description: >-
        Exactly one of: the OS reports `storage_unavailable`,
        `engine_unavailable` or `knowledge_unavailable` (DocumentsError), or
        the kernel proxy reports the module unreachable (`module_not_ready`,
        `module_draining`, … in the generic envelope). ADR-DOC-02 §6 lists
        which proxy codes are safe to retry.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/DocumentsUnavailableError"
              - $ref: "#/components/schemas/ModuleProxyError"
    DocumentsProxyFailure:
      description: >-
        The kernel proxy could not complete the call: 500 (module failure),
        502 (`upstream_unavailable`, `upstream_connection_closed`,
        `request_abandoned`, …) or 504 (`upstream_timeout`). The module may
        have executed; resend with the same idempotency key (ADR-DOC-02 §6).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ModuleProxyError" }
  schemas:
    DomainOsView:
      type: object
      required: [name, namespace, version, enabled, state, granted, missing_models, resources, restart_required]
      properties:
        name:
          type: string
        namespace:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        state:
          type: string
          description: "Open enum: mounted | disabled | degraded | refused."
        detail:
          type: string
        granted:
          type: array
          items:
            type: string
        missing_models:
          type: array
          items:
            type: string
        resources:
          type: string
          description: "Open enum: ok | missing | unknown | not_checked."
        restart_required:
          type: boolean
    DomainOsList:
      type: object
      required: [modules]
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/DomainOsView"
        registry_error:
          type: string
    DomainOsUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    DomainOsStopResponse:
      type: object
      required: [name, stopped]
      properties:
        name:
          type: string
        stopped:
          type: boolean
    DomainOsCommandResponse:
      type: object
      required: [result]
      properties:
        result:
          type: object
          additionalProperties: true
    AttachedAddRequest:
      type: object
      required: [manifest]
      properties:
        manifest: { type: string, description: Exact domain-os.yml text stored by the daemon. }
        allow_relax: { type: boolean, default: false }
    AttachedAddResponse:
      type: object
      required: [name, manifest_digest, token, socket_path, token_id]
      properties:
        name: { type: string }
        manifest_digest: { type: string }
        token:
          type: string
          description: One-time plaintext handshake token; save it now.
        socket_path: { type: string }
        token_id: { type: string }
    AttachedView:
      type: object
      additionalProperties: false
      required: [name, manifest_digest, token_id, created_at, attach_status]
      properties:
        name: { type: string }
        manifest_digest: { type: string }
        token_id: { type: string }
        created_at: { type: string, format: date-time }
        attach_status:
          type: string
          description: "Open enum: detached | attached | disabled."
        generation: { type: integer, minimum: 1, description: Live generation number when attached. }
    AttachedList:
      type: object
      required: [modules]
      properties:
        modules: { type: array, items: { $ref: "#/components/schemas/AttachedView" } }
    AttachedUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Timing:
      type: object
      required: [id, ts, source, model_id, tier, served_by, ok, error_kind, step, session_id, seq, first_token_ms, total_ms, prompt_tokens, completion_tokens]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        source: { type: string }
        model_id: { type: [string, "null"] }
        tier: { type: [string, "null"] }
        served_by: { type: [string, "null"] }
        ok: { type: boolean }
        error_kind: { type: [string, "null"] }
        step: { type: [string, "null"] }
        session_id: { type: [string, "null"] }
        seq: { type: [integer, "null"] }
        first_token_ms: { type: [integer, "null"] }
        total_ms: { type: integer }
        prompt_tokens: { type: [integer, "null"] }
        completion_tokens: { type: [integer, "null"] }
    TimingSummary:
      type: object
      required: [source, model_id, step, count, p50_ms, p95_ms, max_ms]
      properties:
        source: { type: string }
        model_id: { type: string }
        step: { type: string }
        count: { type: integer }
        p50_ms: { type: integer }
        p95_ms: { type: integer }
        max_ms: { type: integer }
    ShutdownReport:
      type: object
      required: [ephemeral, drain_ms, stop_grace_ms, exit_bound_ms, config_warnings, previous]
      properties:
        ephemeral:
          type: boolean
          description: An ephemeral daemon keeps no shutdown evidence.
        evidence_dir:
          type: string
          description: Where the evidence lives (`<state dir>/run`).
        drain_ms:
          type: integer
          minimum: 0
          maximum: 10000
        stop_grace_ms:
          type: integer
          minimum: 0
          maximum: 5000
        exit_bound_ms:
          type: integer
          minimum: 0
          maximum: 60000
          description: From SIGTERM to the process gone, at the latest (2000 at the defaults).
        config_warnings:
          type: array
          items:
            type: string
        previous:
          type: string
          description: "Open enum: no_history | clean | unreadable | cleanup_failed | unconfirmed."
        previous_detail:
          type: string
        last_shutdown:
          $ref: "#/components/schemas/LastShutdown"
    LastShutdown:
      type: object
      required: [stop_result, began_at_ms, took_ms, killed_after_grace, cut_requests, omitted_records]
      properties:
        stop_result:
          type: string
          description: "Open enum: clean | degraded | timed_out."
        began_at_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        took_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        killed_after_grace:
          type: array
          items:
            type: string
        cut_requests:
          type: array
          items:
            type: string
        omitted_records:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    Health:
      type: object
      required: [status, version, backend]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        backend:
          type: string
          description: Open enum — clients must tolerate unknown values
          examples: [node, rust]

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: Open enum
          examples: [system, user, assistant]
        content:
          type: string

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        model:
          type: [string, "null"]
          description: Model id override; null/omitted = daemon default
        session_id:
          type: [string, "null"]
          description: >-
            M1-T12: opt-in session id for D1 personal memory. Omitted/null
            keeps this endpoint stateless (no recall, no write) — the exact
            prior behaviour. When set, the daemon reuses the same
            SessionMemory recall/retain machinery the agent loop (/runs)
            uses, keyed by this id; the memory owner is always the daemon's
            own configured personal-memory owner, never taken from the
            request.

    ChatResponse:
      type: object
      required: [message, usage]
      properties:
        message:
          $ref: "#/components/schemas/ChatMessage"
        usage:
          $ref: "#/components/schemas/Usage"
        model_id:
          type: [string, "null"]
          description: >-
            Provider-reported model id that actually served this call, when
            the provider reported one; null otherwise. Clients must not
            guess a name (e.g. the daemon's DEFAULT_MODEL) when this is null.
        tier:
          type: [string, "null"]
          description: Open enum, "local" | "remote"; null when unknown.
        latency_ms:
          type: [integer, "null"]
          description: Server-measured wall-clock milliseconds for this call.
        memory_receipt:
          type: string
          enum: [saved, paused_not_saved, failed]
          description: >-
            M1-T14: deterministic outcome of an explicit "记住…" turn, set by
            the daemon — never inferred from the model's own reply text.
            Omitted when this prompt was not an explicit remember, or
            session_id was omitted. "saved" covers the write-gate's own
            idempotent reassert/no-op case too (an identical belief already
            active), not just a fresh commit.

    Session:
      type: object
      required: [id, title, channel, workspace_id, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        channel:
          type: string
          description: Open enum
          examples: [desktop, cli, tui, schedule, wechat, nostr]
        workspace_id:
          type: [string, "null"]
          pattern: "^ws_[0-7][0-9ABCDEFGHJKMNPQRSTVWXYZ]{25}$"
          description: Opaque workspace identity; null when unbound.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionCreate:
      type: object
      properties:
        title:
          type: string
          default: ""
        channel:
          type: string
          default: desktop
        workspace_id:
          type: [string, "null"]
          pattern: "^ws_[0-7][0-9ABCDEFGHJKMNPQRSTVWXYZ]{25}$"
          description: Omit/null for a legacy-compatible unbound session.

    RunStatus:
      type: string
      description: |
        State machine (only legal transitions):
        queued → running → completed | failed | cancelled;
        running ⇄ awaiting_approval;
        queued|running|awaiting_approval → cancelled.
      enum: [queued, running, awaiting_approval, completed, failed, cancelled]

    RunMode:
      type: string
      enum: [normal, plan]
      default: normal
      description: >
        H8 plan mode. `plan` starts the run under a read-only tool gate — only
        Read-class tools and `propose_plan` are offered — until the model
        submits a plan a human approves, which unlocks the full tool set for that
        run. Additive: absent/unknown reads as `normal`.

    RunInput:
      type: object
      required: [prompt, workspace_id]
      properties:
        prompt:
          type: string
        workspace_id:
          type: [string, "null"]
          pattern: "^ws_[0-7][0-9ABCDEFGHJKMNPQRSTVWXYZ]{25}$"
          description: Explicit opaque workspace identity copied from the run request.
        model_override:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/RunMode"

    RunOutput:
      type: object
      required: [text]
      properties:
        text:
          type: string

    Run:
      type: object
      required:
        [id, session_id, workspace_id, status, input, output, error, usage,
         schedule_id, created_at, started_at, ended_at]
      properties:
        id:
          type: string
        session_id:
          type: [string, "null"]
          description: Null for transient runs (e.g. created by /chat)
        workspace_id:
          type: [string, "null"]
          pattern: "^ws_[0-7][0-9ABCDEFGHJKMNPQRSTVWXYZ]{25}$"
          description: Opaque workspace identity; filesystem roots stay outside this public schema.
        status:
          $ref: "#/components/schemas/RunStatus"
        input:
          $ref: "#/components/schemas/RunInput"
        output:
          oneOf:
            - $ref: "#/components/schemas/RunOutput"
            - type: "null"
          description: Present when status=completed
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorBody"
            - type: "null"
          description: Present when status=failed
        usage:
          $ref: "#/components/schemas/Usage"
        schedule_id:
          type: [string, "null"]
          description: Set when the run was fired by a schedule
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time

    RunCreate:
      type: object
      required: [prompt]
      properties:
        session_id:
          type: [string, "null"]
          description: Omit/null to create a transient run
        workspace_id:
          type: [string, "null"]
          pattern: "^ws_[0-7][0-9ABCDEFGHJKMNPQRSTVWXYZ]{25}$"
          description: Omit/null for legacy-compatible runs; admission is separate.
        prompt:
          type: string
        model_override:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/RunMode"

    ToolCallStatus:
      type: string
      enum: [running, completed, failed, denied]

    ToolCall:
      type: object
      required: [id, run_id, tool, input, status, output_summary, started_at, ended_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        tool:
          type: string
        input:
          type: object
          description: Tool input (full detail persisted for audit; summarized externally)
          additionalProperties: true
        status:
          $ref: "#/components/schemas/ToolCallStatus"
        output_summary:
          type: [string, "null"]
          description: Null while running
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time

    ApprovalStatus:
      type: string
      description: timed_out is equivalent to a denial (fail-closed)
      enum: [pending, approved, denied, aborted, timed_out]

    Approval:
      type: object
      required:
        [id, run_id, tool_call_id, kind, summary, payload, available_decisions,
         status, decision, expires_at, created_at, decided_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        tool_call_id:
          type: string
        kind:
          type: string
          description: Open enum
          examples: [exec, fs_write, network, module]
        summary:
          type: string
          description: Human-readable one-liner of what is being requested
        payload:
          type: object
          description: Kind-specific detail (e.g. command argv, cwd, reason)
          additionalProperties: true
        available_decisions:
          type: array
          description: |
            Server-driven decision set. UIs MUST render exactly this list and
            MUST NOT hardcode decision options (open set — tolerate unknown values).
          items:
            type: string
          examples: [[approve, approve_for_session, deny, abort]]
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        decision:
          oneOf:
            - $ref: "#/components/schemas/Decision"
            - type: "null"
          description: Set once resolved
        expires_at:
          type: string
          format: date-time
          description: After this instant the approval resolves to timed_out
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time

    Decision:
      type: object
      required: [type]
      description: |
        OPEN SET, server-driven: valid `type` values for a given approval are
        exactly its `available_decisions` — clients submit one of those and
        MUST NOT assume a fixed list; servers reject types not advertised
        (400 invalid_request). Known types and their semantics:
        - `approve` — approve this request only
        - `approve_for_session` — approve and skip future approvals of the
          same tool in this session. NOT offered for `external`-risk tools
          (H4): a whole-tool grant there is replaced by `approve_for_target`.
        - `approve_for_target` — approve and pre-authorise future calls of this
          tool aimed at the SAME `standing_target` (H4), owned by the session or
          the firing schedule. Offered only when the approval carries a
          `standing_target`.
        - `deny` — deny but let the run continue (`reason` REQUIRED and fed
          back to the model)
        - `abort` — deny and cancel the whole run
        Future types (e.g. `approve_and_remember`) may carry extra fields —
        hence additionalProperties: true.
        Fail-closed: the implementation default (broken channel, cancelled
        run, daemon restart) is equivalent to abort/deny — never approve.
      properties:
        type:
          type: string
          description: Open enum
          examples: [approve, approve_for_session, approve_for_target, deny, abort]
        reason:
          type: string
          description: Required when type=deny
      additionalProperties: true

    ModuleApprovalKind:
      type: string
      description: |
        Gate: kernel-executed action. This build's closed set has one entry,
        schedule_callback (a one-shot RFC3339 callback — see
        `docs/design/T7c-ME3e-gate-execution.md`); any other action is still
        forbidden and no record is created for it. Advise: module-domain
        action — presented and recorded for informed consent, not enforced
        (SPEC §6.1: knowledge, not a safety control).
      enum: [gate, advise]

    ModuleApprovalDecision:
      type: string
      description: timed_out is equivalent to a denial (fail-closed), assigned by the periodic timeout scan
      enum: [pending, approved, denied, timed_out]

    ModuleApproval:
      type: object
      required:
        [id, module, request_id, kind, binding, action, target, payload,
         payload_digest, decision, created_at, decided_at, expires_at, executed_at]
      properties:
        id:
          type: string
          description: |
            NOT a ULID (see this document's top-level Conventions note): 64
            hex characters of random entropy, never derived from `request_id`.
          minLength: 64
          maxLength: 64
        module:
          type: string
          description: The submitting module's identity, from its callback connection — never self-reported.
        request_id:
          type: string
          description: The proxied request's correlation id — one half of the submission's idempotency key.
        kind:
          $ref: "#/components/schemas/ModuleApprovalKind"
        binding:
          type: boolean
          description: Always false for advise; always true for gate (T7c/ME-3e).
        action:
          type: string
        target:
          type: [string, "null"]
        payload:
          type: object
          description: |
            The kernel's own record of what it received at submission time —
            not a promise the module acts on exactly this.
          additionalProperties: true
        payload_digest:
          type: string
          description: "sha256:<hex> of the canonicalized payload, computed once at submission."
        decision:
          $ref: "#/components/schemas/ModuleApprovalDecision"
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: After this instant a pending row resolves to timed_out (periodic scan).
        executed_at:
          type: [string, "null"]
          format: date-time
          description: |
            T7c/ME-3e. null until the periodic scan marks this row executed —
            which can only happen for kind=gate, decision=approved rows whose
            action is in the kernel-executable closed set (this build:
            schedule_callback, once its canonicalized target has been
            reached). advise rows, and any gate row that is not approved,
            stay null forever.

    ScheduleSpec:
      description: When to fire
      oneOf:
        - title: cron
          type: object
          required: [type, expr]
          properties:
            type:
              type: string
              const: cron
            expr:
              type: string
              description: 5/6-field cron expression
            tz:
              type: string
              description: IANA timezone (e.g. Asia/Shanghai); default UTC
        - title: every
          type: object
          required: [type, secs]
          properties:
            type:
              type: string
              const: every
            secs:
              type: integer
              minimum: 60
              maximum: 86400
        - title: at
          type: object
          required: [type, ts]
          description: One-shot
          properties:
            type:
              type: string
              const: at
            ts:
              type: string
              format: date-time
      discriminator:
        propertyName: type

    ScheduleAction:
      type: object
      required: [type, prompt]
      properties:
        type:
          type: string
          const: agent_run
        prompt:
          type: string
        session_id:
          type: [string, "null"]
          description: Null = each firing creates a transient run
        model_override:
          type: [string, "null"]

    DeliveryTarget:
      type: object
      required: [type]
      description: Open set — M-F adds channel/webhook/email targets
      properties:
        type:
          type: string
          examples: [desktop_notification]
      additionalProperties: true

    ScheduleOwner:
      type: object
      description: |
        Which module owns this row, and its key with that module — `null`
        exactly when this is a plain user (AgentRun) row (design
        docs/design/ME4-S1-scheduler-callback.md §8.1).
      required: [module, key]
      properties:
        module:
          type: string
        key:
          type: string

    DisabledBy:
      type: [string, "null"]
      enum: [module, user, system, null]
      description: |
        Which layer is holding a schedule from firing, or `null` when
        `effective_enabled` is `true`. Priority: `user_suspended` → `user`,
        then `system_disabled_reason` → `system`, then `!enabled` → `module`
        (module row) / `user` (user row) (§8.1, v3 L-D).

    Schedule:
      type: object
      required:
        [id, name, enabled, spec, action, delivery,
         last_run_at, next_run_at, consecutive_failures,
         owner, user_suspended, system_disabled_reason,
         effective_enabled, disabled_by]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        spec:
          $ref: "#/components/schemas/ScheduleSpec"
        action:
          description: |
            `null` exactly when `owner` is non-null: module rows carry no
            AgentRun action (§8.1). A client can never create a module row
            through `POST /schedules` — `ScheduleCreate` has no `owner`
            field and `ScheduleAction` has exactly one variant (S1-2).
          oneOf:
            - $ref: "#/components/schemas/ScheduleAction"
            - type: "null"
        delivery:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryTarget"
        last_run_at:
          type: [string, "null"]
          format: date-time
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: Null when disabled or one-shot already fired
        consecutive_failures:
          type: integer
          description: Auto-disables the schedule at 5 (emits schedule.disabled)
        owner:
          description: Non-null exactly for a module row (§8.1).
          oneOf:
            - $ref: "#/components/schemas/ScheduleOwner"
            - type: "null"
        user_suspended:
          type: boolean
          description: Only ever true on a module row (migration 0007's CHECK).
        system_disabled_reason:
          type: [string, "null"]
          description: Only ever non-null on a module row (same CHECK).
        effective_enabled:
          type: boolean
          description: |
            Whether this row will actually fire right now: for a user row,
            equals `enabled`; for a module row, `enabled && !user_suspended
            && system_disabled_reason == null`.
        disabled_by:
          $ref: "#/components/schemas/DisabledBy"

    ScheduleCreate:
      type: object
      required: [name, spec, action]
      properties:
        name:
          type: string
        enabled:
          type: boolean
          default: true
        spec:
          $ref: "#/components/schemas/ScheduleSpec"
        action:
          $ref: "#/components/schemas/ScheduleAction"
        delivery:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/DeliveryTarget"

    ScheduleUpdate:
      type: object
      description: Any subset; changing spec recomputes next_run_at
      minProperties: 1
      properties:
        name:
          type: string
        enabled:
          type: boolean
        spec:
          $ref: "#/components/schemas/ScheduleSpec"
        action:
          $ref: "#/components/schemas/ScheduleAction"
        delivery:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryTarget"

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
          default: 0

    HardwareProfile:
      type: object
      description: D0-3 deterministic hardware probe output (docs/agent/PLAN-DECIDE.md §1.1)
      required: [total_mem_bytes, avail_mem_bytes, arch, cpu_cores, accelerator, free_disk_bytes, os]
      properties:
        total_mem_bytes:
          type: integer
        avail_mem_bytes:
          type: integer
        arch:
          type: string
          examples: [aarch64, x86_64]
        cpu_cores:
          type: integer
        accelerator:
          type: string
          enum: [metal, cuda, none]
        free_disk_bytes:
          type: integer
        os:
          type: string
          examples: [macos, linux, windows]
        on_battery:
          type: [boolean, "null"]
          description: Null when the platform/probe cannot tell — not implemented for any OS yet (sysinfo has no power-source API)

    DecideProfile:
      type: object
      required: [profile, hardware_tier, effective_tier, reasons]
      properties:
        profile:
          $ref: "#/components/schemas/HardwareProfile"
        hardware_tier:
          type: string
          enum: [t0, t1, t2, t3]
          description: What the hardware alone supports, ignoring download consent and any user override
        effective_tier:
          type: string
          enum: [t0, t1, t2, t3]
          description: hardware_tier capped by download consent and (downgrade-only) user override
        reasons:
          type: array
          items:
            type: string
          description: Human-readable trail, not a stable machine-parseable enum

    Model:
      type: object
      required: [id, provider, tier, loaded]
      properties:
        id:
          type: string
        provider:
          type: string
          description: Open enum
          examples: [omlx, ollama, remote]
        tier:
          type: string
          description: Open enum — routing tier (M-D)
          examples: [local, remote, lora]
        loaded:
          type: boolean

    ToolInfo:
      type: object
      required: [name, source, description]
      properties:
        name:
          type: string
        source:
          type: string
          description: Open enum
          examples: [builtin, mcp, module]
        description:
          type: string
        risk_class:
          $ref: '#/components/schemas/RiskClass'
        requires_approval:
          type: boolean
          default: false
          description: >-
            DERIVED from risk_class (true for anything but `read`). Present for
            pre-H1 clients; new consumers should read risk_class, which carries
            strictly more information. Absent (pre-H1 daemon) means the class is
            unknown, which is treated as `external`, not as `read`.

    RiskClass:
      type: string
      description: >-
        A tool's intrinsic side-effect category (H1). Each class earns a
        different exemption path, which is the reason for the split: only
        `external` may ever be covered by a target-scoped standing grant;
        `exec` is asked every time. `read` covers network reads (an http GET
        changes nothing) — exfiltration is a taint concern, not a side effect.
        Omitted by a pre-H1 daemon, in which case treat it as `external`.
      enum: [read, write_local, exec, external]
      examples: [read, external]

    StandingGrant:
      type: object
      required: [id, scope_kind, scope_id, tool, target, created_at]
      properties:
        id:
          type: string
        scope_kind:
          type: string
          description: >-
            Who owns the grant. `schedule` when a schedule fired the run —
            what the user consented to was that automation sending there, so
            deleting it takes the grant along.
          enum: [session, schedule]
        scope_id:
          type: string
        tool:
          type: string
        target:
          type: string
          description: >-
            Exact value of the tool's declared target argument. Matched
            exactly — never by prefix, glob, or case. "#ops" does not authorise
            "#ops-2".
          examples: ["#ops-alerts"]
        created_at:
          type: string
          format: date-time

    RiskOverride:
      type: object
      required: [pattern, risk_class, source, created_at]
      properties:
        pattern:
          type: string
          description: Glob over tool names; also the rule's identity.
          examples: [mcp_fs_*]
        risk_class:
          $ref: '#/components/schemas/RiskClass'
        source:
          type: string
          description: Surface the user acted from. Audit metadata, NOT authorization.
          examples: [desktop, cli, tui]
        created_at:
          type: string
          format: date-time

    MemoryAssertion:
      type: object
      required: [id, text, recorded_at, status, evidence, session]
      description: >-
        One qualified personal-memory assertion, with provenance (M1-T10 /
        `docs/research/MEMORY-STRATEGY.md` §4.1).
      properties:
        id:
          type: string
        text:
          type: string
          description: The remembered original sentence.
          examples: ["我对花生过敏"]
        recorded_at:
          type: string
          format: date-time
          description: When the system recorded this belief.
        status:
          type: string
          enum: [active, retracted, held]
          description: >-
            `held` = an unconfirmed candidate (never returned by this
            endpoint today — list/search already filter to qualified,
            current beliefs — but computed from the real row state rather
            than hardcoded).
        evidence:
          type: array
          items:
            type: string
          description: Evidence event id(s) this belief was recorded from.
        session:
          type: [string, "null"]
          description: >-
            The session its evidence was recorded in, or `null` when that
            cannot be determined (no evidence, or the evidence event is
            missing).

    MemorySettings:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >-
            The persistent personal-memory switch. `false` stops new writes
            and cross-session recall; existing assertions are kept, and the
            setting survives a daemon restart.

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Open enum: invalid_request, unauthorized, not_found, conflict,
            approval_already_resolved, provider_unavailable,
            run_not_cancellable (reserved), internal,
            admission_refused, module_panicked, module_killed,
            module_owned_schedule, not_a_module_schedule, schedule_conflict
        message:
          type: string
        hint:
          type: string
          description: |
            What to do about it, when there is a concrete next step (ERR-1).
            Kept separate from `message` (what happened).
        details:
          type: object
          additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    # ---- Documenting OS (ADR-DOC-02) ----
    DocumentIdString:
      type: string
      description: >-
        `doc_` + ULID, generated by the OS (ADR-DOC-02 §3). The first ULID
        character is 0–7: larger values overflow 128 bits.
      pattern: "^doc_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    Sha256Address:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    DocumentsErrorCode:
      type: string
      description: Closed set; adding a code requires amending ADR-DOC-02 §6.
      enum:
        - invalid_request
        - not_found
        - payload_too_large
        - unsupported_format
        - parse_failed
        - partial_parse
        - idempotency_key_reused
        - change_set_incomplete
        - upload_checksum_mismatch
        - knowledge_disabled
        - revision_conflict
        - change_set_stale
        - change_set_committed
        - upload_offset_mismatch
        - stale_index
        - permission_denied
        - knowledge_unavailable
        - engine_unavailable
        - storage_unavailable
    DocumentsError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/DocumentsErrorCode" }
            message: { type: string }
            hint: { type: string }
            details:
              type: object
              required: [retryable]
              properties:
                retryable: { type: boolean }
              additionalProperties: true
          # Code-specific details (ADR-DOC-02 §6).
          allOf:
            - if: { properties: { code: { const: engine_unavailable } } }
              then:
                properties:
                  details:
                    required: [engine]
                    properties: { retryable: { const: true }, engine: { type: string } }
            - if: { properties: { code: { const: knowledge_unavailable } } }
              then:
                properties: { details: { properties: { retryable: { const: true } } } }
            - if: { properties: { code: { const: revision_conflict } } }
              then:
                properties:
                  details:
                    required: [current_revision]
                    properties: { current_revision: { type: integer, minimum: 1 } }
            - if: { properties: { code: { const: change_set_committed } } }
              then:
                properties:
                  details:
                    required: [revision]
                    properties: { revision: { type: integer, minimum: 1 } }
            - if: { properties: { code: { const: upload_offset_mismatch } } }
              then:
                properties:
                  details:
                    required: [received_offset]
                    properties: { received_offset: { type: integer, minimum: 0 } }
            # storage_unavailable: retryable depends on the cause (ADR-DOC-02 §6,
            # David 2026-10-08) — only lock contention is worth an automatic retry.
            - if: { properties: { code: { const: storage_unavailable } } }
              then:
                properties:
                  details:
                    required: [cause]
                    properties:
                      cause: { enum: [locked, busy, corrupt, not_writable, disk_full] }
                    allOf:
                      - if: { properties: { cause: { enum: [locked, busy] } } }
                        then: { properties: { retryable: { const: true } } }
                        else: { properties: { retryable: { const: false } } }
    DocumentsUnavailableError:
      description: The three availability codes a 503 from the OS itself may carry.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [storage_unavailable, engine_unavailable, knowledge_unavailable] }
    DocumentsInvalidRequestError:
      description: A 400 from the OS itself.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [invalid_request] }
    DocumentsNotFoundError:
      description: A 404 from the OS itself.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [not_found] }
    DocumentsConflictError:
      description: The 409s of the slice-1 upload routes.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [upload_offset_mismatch] }
    DocumentsTooLargeError:
      description: A 413 from the OS itself.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [payload_too_large] }
    DocumentsRenderUnprocessableError:
      description: The 422s of render.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [unsupported_format, parse_failed] }
    DocumentsUploadUnprocessableError:
      description: The 422 of upload creation.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [idempotency_key_reused] }
    DocumentsImportUnprocessableError:
      description: The 422s of import.
      allOf:
        - $ref: "#/components/schemas/DocumentsError"
        - type: object
          properties:
            error:
              properties:
                code: { enum: [idempotency_key_reused, upload_checksum_mismatch, unsupported_format] }
    ModuleProxyError:
      description: >-
        An error produced by the kernel or its proxy, not by the OS: the
        generic envelope, with any code except the ones only the Documenting
        OS uses. `invalid_request`, `not_found` and `payload_too_large` are
        shared with the kernel and stay allowed.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            error:
              properties:
                code:
                  not:
                    enum:
                      - unsupported_format
                      - parse_failed
                      - partial_parse
                      - idempotency_key_reused
                      - change_set_incomplete
                      - upload_checksum_mismatch
                      - knowledge_disabled
                      - revision_conflict
                      - change_set_stale
                      - change_set_committed
                      - upload_offset_mismatch
                      - stale_index
                      - permission_denied
                      - knowledge_unavailable
                      - engine_unavailable
                      - storage_unavailable
    DocumentsOperationStatus:
      oneOf:
        - type: object
          required: [op, available]
          properties:
            op: { type: string }
            available: { type: boolean, const: true }
            reason: { type: "null" }
        - type: object
          required: [op, available, reason]
          properties:
            op: { type: string }
            available: { type: boolean, const: false }
            reason: { $ref: "#/components/schemas/DocumentsErrorCode" }
    DocumentsCapabilities:
      type: object
      required: [os_version, storage, engines, knowledge, operations]
      properties:
        os_version: { type: string }
        storage:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [ready, degraded, unavailable] }
        engines:
          type: array
          items:
            type: object
            required: [id, kind, formats, state]
            properties:
              id: { type: string }
              kind: { type: string, enum: [parse, ocr, render, export] }
              formats: { type: array, items: { type: string } }
              state: { type: string, enum: [absent, installing, ready, failed] }
              version: { type: [string, "null"] }
        knowledge:
          type: object
          required: [setting, state]
          properties:
            setting: { type: string, enum: ["on", "off"] }
            state:
              type: string
              enum: [registered, loading, ready, degraded, unavailable, disabled]
        operations:
          type: array
          items: { $ref: "#/components/schemas/DocumentsOperationStatus" }
    DocumentRevisionSummary:
      type: object
      required: [revision, content_sha256, size, media_type]
      properties:
        revision: { type: integer, minimum: 1 }
        content_sha256: { $ref: "#/components/schemas/Sha256Address" }
        size: { type: integer, minimum: 0 }
        media_type: { type: string }
    Document:
      type: object
      required: [document_id, title, media_type, head_revision, created_at, updated_at]
      properties:
        document_id: { $ref: "#/components/schemas/DocumentIdString" }
        title: { type: string }
        media_type: { type: string }
        head_revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required: [head]
          properties:
            head: { $ref: "#/components/schemas/DocumentRevisionSummary" }
    JobIdString:
      type: string
      pattern: "^job_[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    DocumentsUploadRequest:
      type: object
      required: [total_size, sha256]
      additionalProperties: false
      properties:
        total_size: { type: integer, minimum: 1 }
        sha256:
          $ref: "#/components/schemas/Sha256Address"
          description: Whole-file hash, checked at import (`upload_checksum_mismatch`).
        filename:
          type: string
          description: >-
            Display name only, used as the default title. A base name, never a
            path (ADR-001): no `/` or `\`.
          minLength: 1
          maxLength: 255
          pattern: "^[^/\\\\]+$"
    DocumentsUpload:
      type: object
      required: [upload_id, total_size, sha256, received, status, expires_at]
      properties:
        upload_id: { type: string, pattern: "^upl_[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        total_size: { type: integer, minimum: 1 }
        sha256: { $ref: "#/components/schemas/Sha256Address" }
        received: { type: integer, minimum: 0 }
        status: { type: string, enum: [receiving, complete, imported, expired] }
        expires_at:
          type: string
          format: date-time
          description: 24 h after the last chunk arrived (§5.6).
    DocumentsImportRequest:
      type: object
      required: [upload_id]
      additionalProperties: false
      properties:
        upload_id: { type: string, pattern: "^upl_[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
        title: { type: string, minLength: 1, maxLength: 500 }
    DocumentsJob:
      type: object
      required: [job_id, kind, status, attempt, created_at, updated_at]
      properties:
        job_id: { $ref: "#/components/schemas/JobIdString" }
        kind:
          type: string
          description: >-
            `import` and `extract` in slice 1; later slices add more (e.g.
            `export`), so clients must tolerate unknown kinds.
        document_id: { $ref: "#/components/schemas/DocumentIdString" }
        revision: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted]
        attempt: { type: integer, minimum: 1 }
        progress:
          type: [object, "null"]
          required: [stage, done, total, unit]
          properties:
            stage: { type: string }
            done: { type: integer, minimum: 0 }
            total: { type: [integer, "null"], minimum: 0 }
            unit: { type: string }
        error:
          type: [object, "null"]
          required: [code, message]
          description: >-
            Set when `failed`; `cancelled` appears only here, never as an HTTP
            error (§6).
          properties:
            code:
              anyOf:
                - $ref: "#/components/schemas/DocumentsErrorCode"
                - const: cancelled
            message: { type: string }
        result:
          type: [object, "null"]
          description: Set when `succeeded`, e.g. the imported document and its r1.
          properties:
            document_id: { $ref: "#/components/schemas/DocumentIdString" }
            revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      allOf:
        # failed: carries an error from the closed set (never "cancelled").
        - if: { properties: { status: { const: failed } } }
          then:
            required: [error]
            properties:
              error:
                type: object
                properties: { code: { $ref: "#/components/schemas/DocumentsErrorCode" } }
        # cancelled: no error, or the "cancelled" marker only.
        - if: { properties: { status: { const: cancelled } } }
          then:
            properties:
              error:
                anyOf:
                  - type: "null"
                  - type: object
                    properties: { code: { const: cancelled } }
        # still working or succeeded: no error.
        - if: { properties: { status: { enum: [queued, running, cancelling, succeeded] } } }
          then: { properties: { error: { type: "null" } } }
        # a succeeded import names its document and r1.
        - if:
            properties: { status: { const: succeeded }, kind: { const: import } }
            required: [status, kind]
          then:
            required: [result]
            properties:
              result:
                type: object
                required: [document_id, revision]
                properties:
                  document_id: { $ref: "#/components/schemas/DocumentIdString" }
                  revision: { const: 1 }
    DocumentList:
      type: object
      required: [documents, next_cursor]
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        next_cursor: { type: [string, "null"] }

    # ---- Sin90 module (SIN90-domain.md) ----
    Sin90DirectionStatus:
      type: string
      enum: [draft, active, paused, achieved, abandoned]
    Sin90TaskStatus:
      type: string
      enum: [backlog, planned, in_progress, done, dropped, carried_over]
    Sin90ScheduleBlockStatus:
      type: string
      enum: [planned, started, completed, skipped]
    Sin90ProposalStatus:
      type: string
      enum: [pending, applying, applied, rejected]

    Sin90Direction:
      type: object
      required: [id, title, status, target_window, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/Sin90DirectionStatus" }
        target_window: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    Sin90ScheduleBlock:
      type: object
      required: [id, status, planned_minutes, created_at, updated_at]
      properties:
        id: { type: string }
        direction_id: { type: [string, "null"] }
        task_id: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/Sin90ScheduleBlockStatus" }
        planned_minutes: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    Sin90AttentionRow:
      type: object
      required: [direction_id, actual_min]
      properties:
        direction_id: { type: string, description: "\"\" == no direction" }
        direction_title: { type: [string, "null"] }
        actual_min: { type: integer }

    Sin90AppliedProposal:
      type: object
      required: [proposal_id, event_ids]
      properties:
        proposal_id: { type: string }
        event_ids: { type: array, items: { type: string } }

    Sin90Alloc:
      type: object
      required: [direction_id, pct]
      additionalProperties: false
      properties:
        direction_id: { type: string }
        pct: { type: integer }

    Sin90NewTask:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string }
        direction_id: { type: [string, "null"] }

    Sin90Op:
      description: One atomic change, internally tagged by `op`.
      oneOf:
        - type: object
          required: [op, title, target_window]
          additionalProperties: false
          properties:
            op: { type: string, const: create_direction }
            title: { type: string }
            target_window: { type: string }
        - type: object
          required: [op, task_id, to]
          additionalProperties: false
          properties:
            op: { type: string, const: transition_task }
            task_id: { type: string }
            to: { $ref: "#/components/schemas/Sin90TaskStatus" }
        - type: object
          required: [op, week_id, tasks]
          additionalProperties: false
          properties:
            op: { type: string, const: create_tasks }
            week_id: { type: string }
            tasks: { type: array, items: { $ref: "#/components/schemas/Sin90NewTask" } }
        - type: object
          required: [op, week_id, order]
          additionalProperties: false
          properties:
            op: { type: string, const: reorder_tasks }
            week_id: { type: string }
            order: { type: array, items: { type: string } }
        - type: object
          required: [op, rhythm_id, new_alloc]
          additionalProperties: false
          properties:
            op: { type: string, const: adjust_rhythm }
            rhythm_id: { type: string }
            new_alloc: { type: array, items: { $ref: "#/components/schemas/Sin90Alloc" } }
        - type: object
          required: [op, task_id, to_week]
          additionalProperties: false
          properties:
            op: { type: string, const: carry_over_task }
            task_id: { type: string }
            to_week: { type: string }

    Sin90Proposal:
      type: object
      required: [id, status, source, ops]
      additionalProperties: false
      description: |
        A batch of atomic ops. `status` MUST be `pending` on submit — the server
        stores it as pending regardless (only pending is meaningful here).
      properties:
        id: { type: string }
        status: { type: string, const: pending }
        source: { type: string, enum: [local_brain, executive, rule] }
        ops: { type: array, items: { $ref: "#/components/schemas/Sin90Op" } }
        rationale: { type: [string, "null"] }

    Sin90StoredProposal:
      type: object
      description: >
        A persisted proposal as returned by the read endpoints: the stored row
        plus its apply receipt (`result`, present only once `applied`).
      required: [id, status, source, ops, created_at]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/Sin90ProposalStatus" }
        source: { type: string, enum: [local_brain, executive, rule] }
        ops: { type: array, items: { $ref: "#/components/schemas/Sin90Op" } }
        rationale: { type: [string, "null"] }
        created_at: { type: string }
        decided_at: { type: [string, "null"] }
        result:
          oneOf:
            - $ref: "#/components/schemas/Sin90AppliedProposal"
            - type: "null"
