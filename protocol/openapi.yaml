openapi: 3.1.0
info:
  title: Agent24 Daemon API
  version: 1.0.0
  summary: v1 contract for agent24d (Rust) and node-daemon (mock/reference)
  description: |
    Single source of truth for the Agent24 daemon REST API (hand-written until
    task B4 switches generation to the `agent24-protocol` Rust crate with a CI
    zero-drift check; since B1 the Rust types are locked to this contract via
    fixture round-trip tests). Human-readable spec: `docs/specs/SPEC-002-protocol.md`.

    Conventions:
    - All fields snake_case; timestamps are ISO 8601 UTC. Most ids are ULID
      strings, with ONE exception: `ModuleApproval.id` (`approval_id`, T7b/ME-3e)
      is 64 hex characters of random entropy, not a ULID — see
      `docs/design/T7b-ME3e-approvals.md` decision 3 for why (it must not be
      derivable from `request_id` or anything else predictable).
    - Paths marked `x-milestone: M-C` are not implemented by the M-A mock daemon.
    - WS event protocol lives in `protocol/events.schema.json` (not in this file).
    - Auth: `Authorization: Bearer <token>` (agent24d). The M-A mock daemon on
      127.0.0.1:8765 accepts an empty token. Clients MUST ignore unknown fields
      and unknown enum values (forward compatibility).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: Agent24
    url: https://github.com/iDoris-ai/Agent24

servers:
  - url: http://127.0.0.1:8765/api/v1
    description: M-A mock daemon (node-daemon, fixed port, empty token allowed)
  - url: http://127.0.0.1:{port}/api/v1
    description: agent24d (dynamic port + token from the stdout ready line)
    variables:
      port:
        default: "0"
        description: Dynamic port announced by the agent24d ready line

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health, version, and process-level daemon endpoints.
  - name: attached
    description: Attached module registrations and control.
  - name: timings
    description: Model-call timing rows and summaries.
  - name: chat
    description: One-shot LLM chat completion.
  - name: sessions
    description: Conversation sessions — the container runs belong to.
  - name: runs
    description: Agent runs, their lifecycle, output, and cancellation.
  - name: approvals
    description: Human-in-the-loop tool-call decisions for a run.
  - name: module-approvals
    description: |
      Out-of-process module approvals (T7b/ME-3e) — `advise` (module-domain
      actions, presented + recorded, not enforced) and `gate` (kernel-executed
      actions; this build's closed set is empty, so every gate submission is
      forbidden and no record is ever created for it). A PARALLEL surface to
      `approvals` above: async submit-then-poll, not run_id-tied, no
      synchronous wait for a human decision.
  - name: schedules
    description: Cron-driven scheduled runs (CRUD + run-now).
  - name: tools
    description: Tool inventory, risk classes, and trust overrides.
  - name: memory
    description: >-
      M1-T10: the personal-memory surface — list/search qualified assertions
      with provenance, retract one, and the persistent pause switch. Personal
      space only; `owner` is injected by the daemon from session identity and
      is never a request parameter.
  - name: sin90
    description: The Sin90 Personal-OS module (own store; degrades independently).
  - name: documents
    description: >-
      The Documenting domain OS (ADR-DOC-01 / ADR-DOC-02), an out-of-process
      module served under `/api/v1/documents`. Every error carries
      `details.retryable`; clients branch on `error.code`, never on the HTTP
      status. Single local user (ADR-DOC-01 §3).

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and backend identity
      security: []
      responses:
        "200":
          description: Daemon is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /chat:
    post:
      operationId: postChat
      tags: [chat]
      summary: Pass-through chat (compat path; superseded by runs long-term)
      description: |
        Stateless from the client's perspective, but the server creates a
        **transient Run** (session_id = null) per call and emits the normal
        `run.started` / `model.delta` / `run.completed` events for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Completed chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"

  /decide/profile:
    get:
      operationId: getDecideProfile
      x-milestone: D0-3
      tags: [system]
      summary: Local hardware profile + decision-model hardware/effective tier (docs/agent/PLAN-DECIDE.md §1.1)
      description: |
        Deterministic hardware probe (RAM/CPU/accelerator/disk/OS/battery) plus
        the tier it implies, and the tier actually in effect once download
        consent is applied (D0-3 reads consent from the daemon's own
        `A24_DECIDE_DOWNLOAD_CONSENT` env var — no per-request input yet).
        `reasons` is a human-readable trail, not a stable machine-parseable
        enum. No decision-model inference happens on this route; it never
        downloads anything.
      responses:
        "200":
          description: Hardware profile and tier decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideProfile"

  /models:
    get:
      operationId: listModels
      tags: [system]
      summary: List known models with tier and load status
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"

  /os:
    get:
      operationId: listDomainOs
      tags: [system]
      summary: List domain OS modules and registry state
      responses:
        "200":
          description: Module configuration, runtime state, and resource availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOsList"
        "503":
          description: "registry_invalid: the os.json registry could not be read or parsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /os/{name}:
    patch:
      operationId: updateDomainOs
      tags: [system]
      summary: Enable or disable a domain OS module
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainOsUpdate"
      responses:
        "200":
          description: Updated module list and runtime state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "attached_module or admission_refused"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "internal or stop_failed: configuration write or module stop failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "registry_invalid or disable_pending"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /os/{name}/stop:
    post:
      operationId: stopDomainOs
      tags: [system]
      summary: Stop a running domain OS module without changing os.json
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop was requested and the module no longer admits requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOsStopResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: "stop_failed: the module supervisor could not stop cleanly"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "disable_pending: the module is still admitting requests"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /os/{name}/commands/{command}:
    post:
      operationId: invokeAttachedModuleCommand
      tags: [system]
      summary: Invoke a command declared by an attached module
      description: >-
        A JSON object body of at most 64 KiB is forwarded to the module; its object
        result is returned.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: command
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Command result from the attached module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainOsCommandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: "forbidden: the command is not declared by the module manifest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          description: "busy: the module has reached its in-flight command limit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "connection_lost or module_error: the module connection ended or returned an invalid response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "module_not_ready: the module is not attached or its command was not sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: "timeout: the module did not answer before the command deadline"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attached:
    post:
      operationId: registerAttachedModule
      tags: [attached]
      summary: Register an attached module or rotate its token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachedAddRequest"
      responses:
        "200":
          description: Existing registration was rotated; includes the new one-time token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedAddResponse"
        "201":
          description: Registration created; includes the one-time token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedAddResponse"
        "400": { description: "invalid_request or invalid_manifest", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413":
          description: "payload_too_large: the request exceeded the daemon-wide body limit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { description: "relax_requires_confirmation: privacy widening needs allow_relax", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "name_taken: this name is already provided by another module", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listAttachedModules
      tags: [attached]
      summary: List attached module registrations
      description: List fields expose public metadata without token credentials or token hashes.
      responses:
        "200":
          description: Registrations and live attach status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedList"
        "500":
          $ref: "#/components/responses/Internal"

  /attached/{name}:
    delete:
      operationId: revokeAttachedModule
      tags: [attached]
      summary: Revoke an attached module registration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Registration revoked
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updateAttachedModule
      tags: [attached]
      summary: Enable or disable an attached module
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachedUpdate"
      responses:
        "200":
          description: Updated registration list and live status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachedList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /timings:
    get:
      operationId: listTimings
      tags: [timings]
      summary: List model-call timing rows
      parameters:
        - name: source
          in: query
          schema:
            type: string
        - name: since
          in: query
          description: Timestamp lower bound passed to the timing store.
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 500, accepts u32 values, and caps results at 5000; invalid values return 400.
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
      responses:
        "200":
          description: Matching rows, newest first
          content:
            application/json:
              schema:
                type: object
                required: [timings]
                properties:
                  timings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Timing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"

  /timings/summary:
    get:
      operationId: summarizeTimings
      tags: [timings]
      summary: Summarize timing totals by source, model, and step
      parameters:
        - name: since
          in: query
          description: Timestamp lower bound passed to the timing store.
          schema:
            type: string
      responses:
        "200":
          description: Count, p50, p95, and maximum duration per group
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimingSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/Internal"

  /usage:
    get:
      operationId: getUsage
      tags: [system]
      summary: Aggregate token/cost usage since daemon start
      responses:
        "200":
          description: Aggregate usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"

  /sessions:
    post:
      operationId: createSession
      x-milestone: M-C
      tags: [sessions]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: listSessions
      x-milestone: M-C
      tags: [sessions]
      summary: List sessions
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      x-milestone: M-C
      tags: [sessions]
      summary: Get one session
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs:
    post:
      operationId: createRun
      x-milestone: M-C
      tags: [runs]
      summary: Start an agent run (async; progress via WS events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCreate"
      responses:
        "202":
          description: Run accepted (status=queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: listRuns
      x-milestone: M-C
      tags: [runs]
      summary: List runs, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"

  /runs/{id}:
    get:
      operationId: getRun
      x-milestone: M-C
      tags: [runs]
      summary: Get one run
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      x-milestone: M-C
      tags: [runs]
      summary: Request cancellation (idempotent; valid in any state)
      description: |
        Idempotent: cancelling an already-terminal run returns 202 with the
        current (unchanged) run. Cancellation of a streaming run must take
        effect within 1s (see TASKS C2 acceptance).
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "202":
          description: Cancellation requested (or run already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /approvals:
    get:
      operationId: listApprovals
      x-milestone: M-C
      tags: [approvals]
      summary: List approvals (polling fallback for TUI/UI)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"

  /approvals/{id}:
    post:
      operationId: decideApproval
      x-milestone: M-C
      tags: [approvals]
      summary: Submit the decision for a pending approval
      description: |
        Body is a Decision object. The decision type MUST be one of the
        `available_decisions` advertised on the approval. Fail-closed semantics:
        an expired or otherwise resolved approval returns 409
        `approval_already_resolved` and the submitted decision is discarded.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval already resolved or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: approval_already_resolved
                  message: Approval apr_01H… was already resolved (status=timed_out)

  /module-approvals:
    get:
      operationId: listModuleApprovals
      x-milestone: M-C
      tags: [module-approvals]
      summary: List module (gate/advise) approvals
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModuleApprovalDecision"
      responses:
        "200":
          description: Module approval list
          content:
            application/json:
              schema:
                type: object
                required: [module_approvals]
                properties:
                  module_approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleApproval"
        "400":
          $ref: "#/components/responses/BadRequest"

  /module-approvals/{id}:
    get:
      operationId: getModuleApproval
      x-milestone: M-C
      tags: [module-approvals]
      summary: Fetch one module approval by id
      description: |
        Not scoped to a calling module — this is an operator surface
        (`curl`/dashboard), unlike the wire `_a24/approval/status` call a
        module itself makes, which IS scoped to its own module.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The module approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleApproval"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: decideModuleApproval
      x-milestone: M-C
      tags: [module-approvals]
      summary: Approve or deny a pending module approval
      description: |
        Body is `{decision: "approved"|"denied"}` — `pending`/`timed_out` are
        states the SYSTEM assigns (submission, the periodic timeout scan),
        never a value a caller may request directly. The decision CAS also
        checks `expires_at`: a row the periodic scan has not yet reached but
        which is already past its deadline conflicts here too, not just after
        the next scan tick.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, denied]
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleApproval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Module approval already resolved or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: module_approval_already_resolved
                  message: module approval <id> was already resolved or has expired

  /schedules:
    post:
      operationId: createSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Create a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Created (next_run_at computed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: listSchedules
      x-milestone: M-C
      tags: [schedules]
      summary: List schedules
      responses:
        "200":
          description: Schedule list
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"

  /schedules/{id}:
    get:
      operationId: getSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Get one schedule
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Partially update a schedule
      description: |
        Any subset of name/enabled/spec/action/delivery. Changing `spec`
        recomputes `next_run_at` immediately.

        On a module-owned row (design
        docs/design/ME4-S1-scheduler-callback.md §8.2), the ONLY accepted
        shape is exactly `{"enabled": ...}` — mapped onto suspend/resume
        (`false`→suspend, `true`→resume). Any other field present, or
        `enabled` together with anything else, is `409
        module_owned_schedule`. The write-back on a USER row is CAS'd
        (§2.4); a concurrent tick/PATCH that keeps losing the race for 3
        retries is `409 schedule_conflict`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Module-owned row rejected a field other than a lone `enabled`
            (`module_owned_schedule`), or the CAS write-back never landed
            after 3 retries (`schedule_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                module_owned_schedule:
                  value:
                    error:
                      code: module_owned_schedule
                      message: schedule sch_01H… is owned by a module
                      hint: >-
                        this field is controlled by the module; use POST
                        .../suspend, POST .../resume, a PATCH of exactly
                        {"enabled": true|false}, or DELETE
                schedule_conflict:
                  value:
                    error:
                      code: schedule_conflict
                      message: >-
                        schedule sch_01H… was modified concurrently; retry
                        the request
    delete:
      operationId: deleteSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Delete a schedule
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{id}/run_now:
    post:
      operationId: runScheduleNow
      x-milestone: M-C
      tags: [schedules]
      summary: Trigger one run immediately (does not change next_run_at)
      description: |
        Design §4.7: a user (AgentRun) row answers `{run_id}`, same as
        always; a module-owned row answers `{fire_id}` — it records a fire
        (own `fire_id`, `fire_trigger=run_now`) for the delivery pump to
        pick up, without touching `next_run_at` or disturbing the tick
        source's own outstanding fire. Neither arm looks at `enabled` /
        `user_suspended` / `system_disabled_reason` — this is an explicit
        "try it now" the user asked for.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "202":
          description: Run queued (user row) or fire recorded (module row)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [run_id]
                    properties:
                      run_id:
                        type: string
                  - type: object
                    required: [fire_id]
                    properties:
                      fire_id:
                        type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{id}/suspend:
    post:
      operationId: suspendSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Suspend a module-owned schedule (design §8.2)
      description: |
        Module rows only. Idempotent: suspending an already-suspended row
        is a no-op that still answers `200` with the current view. Clears
        `next_run_at` and, in the same transaction, retires the schedule's
        outstanding (pending/deferred) deliveries. A user (AgentRun) row —
        use `PATCH {"enabled": false}` instead — answers `409
        not_a_module_schedule`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Suspended (or already was) — the current view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a module-owned schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_a_module_schedule
                  message: schedule sch_01H… is not a module-owned schedule
                  hint: 'use PATCH {"enabled": true|false} on a user-owned schedule'

  /schedules/{id}/resume:
    post:
      operationId: resumeSchedule
      x-milestone: M-C
      tags: [schedules]
      summary: Resume a module-owned schedule (design §8.2)
      description: |
        Module rows only. Idempotent: resuming a row that is neither
        suspended nor system-disabled is a no-op — 0 rows affected, still
        `200` with the current view (a module's own `enabled=false` shows
        up as `disabled_by="module"` and is unaffected by resume). Also
        clears a kernel `system_disabled_reason` (v2 M2) and, when the row
        is enabled, recomputes `next_run_at` from the current spec
        (skip-missed). A user (AgentRun) row answers `409
        not_a_module_schedule`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Resumed (or already was) — the current view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not a module-owned schedule, or a concurrent module upsert raced the resume 3 times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_a_module_schedule:
                  value:
                    error:
                      code: not_a_module_schedule
                      message: schedule sch_01H… is not a module-owned schedule
                      hint: 'use PATCH {"enabled": true|false} on a user-owned schedule'
                schedule_conflict:
                  value:
                    error:
                      code: schedule_conflict
                      message: >-
                        schedule sch_01H… was modified concurrently; retry
                        the request

  /shutdown:
    get:
      operationId: getShutdownReport
      tags: [system]
      summary: The shutdown budgets in effect and the previous shutdown (authenticated)
      description: |
        SHUT-1c. The out-of-process modules' drain and stop grace
        (`A24_MODULE_DRAIN_MS`, `A24_MODULE_STOP_GRACE_MS`), the exit bound
        they give, values that were rejected, and what this daemon found of
        the one before it — so a budget that is too tight can be found and
        adjusted. agent24d only.
      responses:
        "200":
          description: The report, fixed at start-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShutdownReport"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: shutdownDaemon
      tags: [system]
      summary: Request graceful daemon shutdown (authenticated)
      description: |
        The bearer token proves the caller owns this daemon instance — the CLI
        uses this instead of signalling a pid from a possibly-stale state file.
        agent24d only until the node mock gains parity.
      responses:
        "202":
          description: Shutdown initiated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tools:
    get:
      operationId: listTools
      x-milestone: M-C
      tags: [tools]
      summary: List registered tools (builtin / mcp / module)
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolInfo"

  /standing-grants:
    get:
      operationId: listStandingGrants
      x-milestone: M-H
      tags: [tools]
      summary: List target-scoped standing grants
      description: >-
        Persistent pre-authorisations of the form "this tool, aimed at exactly
        this target, for this session or schedule". They outlive the process and
        fire while nobody is watching, so listing them is not a convenience —
        it is the other half of being allowed to mint them.
      responses:
        "200":
          description: Grant list, newest first
          content:
            application/json:
              schema:
                type: object
                required: [standing_grants]
                properties:
                  standing_grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/StandingGrant"

  /standing-grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeStandingGrant
      x-milestone: M-H
      tags: [tools]
      summary: Revoke one standing grant
      description: >-
        Takes effect on the next call — the broker reads the table per dispatch
        rather than caching it, so a revocation is never queued behind a
        restart. Deleting a schedule revokes the grants it owned as well.
      responses:
        "204":
          description: Revoked
        "404":
          description: No such grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tool-overrides:
    get:
      operationId: listToolOverrides
      x-milestone: M-H
      tags: [tools]
      summary: List the user's local risk overrides
      description: >-
        User-local rules adjusting a tool's risk_class. NEVER written by a
        module, persona, or MCP server: a package may declare which tools it
        wants, but only the user decides how far to trust them.
      responses:
        "200":
          description: Override list, most specific rule first
          content:
            application/json:
              schema:
                type: object
                required: [overrides]
                properties:
                  overrides:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskOverride"

  /tool-overrides/{pattern}:
    parameters:
      - name: pattern
        in: path
        required: true
        description: >-
          Glob over tool names (`*` any run, `?` one char). It is the rule's
          identity, so writing the same pattern twice replaces it.
        schema:
          type: string
        examples:
          server: { value: "mcp_fs_*" }
          exact: { value: "mcp_fs_read-file" }
    put:
      operationId: setToolOverride
      x-milestone: M-H
      tags: [tools]
      summary: Create or replace one risk override
      description: >-
        The rule is stored as written. Whether it takes EFFECT is decided at
        dispatch: a builtin's class may be tightened but never relaxed, since
        `external` on third-party code is a guess the user may correct while a
        builtin's class is not. A stored-but-inert rule stays listed and
        revocable rather than being silently dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [risk_class]
              properties:
                risk_class:
                  $ref: "#/components/schemas/RiskClass"
                source:
                  type: string
                  description: Surface the user acted from. Audit metadata, NOT authorization.
                  examples: [desktop, cli, tui]
      responses:
        "200":
          description: The stored rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskOverride"
        "400":
          description: Empty pattern
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteToolOverride
      x-milestone: M-H
      tags: [tools]
      summary: Remove one risk override
      responses:
        "204":
          description: Removed
        "404":
          description: No such rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memory/assertions:
    get:
      operationId: listMemoryAssertions
      x-milestone: M1-T10
      tags: [memory]
      summary: List or search personal-memory assertions
      description: >-
        Personal space only. Without `q`: the latest qualified assertions,
        newest `recorded_at` first. With `q`: full-text `search_any` over the
        SAME scope + qualified + current filters. `owner` is injected by the
        daemon from session identity — never a request parameter.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: >-
            Default 20 if omitted. Capped at 200 regardless of what is asked
            for. `0` (or anything else that is not a positive integer) is a
            400, not silently clamped up to 1.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Assertion list
          content:
            application/json:
              schema:
                type: object
                required: [assertions]
                properties:
                  assertions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryAssertion"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Personal memory is not available on this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memory/assertions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: forgetMemoryAssertion
      x-milestone: M1-T10
      tags: [memory]
      summary: Retract (forget) one assertion
      description: >-
        Stops it being recalled in any new session; the original conversation
        stays in the local event log. Repeatable (already-retracted is still
        204). An id that does not exist UNDER THIS OWNER 404s — identically
        whether it never existed or belongs to a module partition, so this
        never leaks which case it was.
      responses:
        "204":
          description: Retracted (or already was)
        "503":
          description: Personal memory is not available on this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such assertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memory/settings:
    get:
      operationId: getMemorySettings
      x-milestone: M1-T10
      tags: [memory]
      summary: Read the personal-memory pause switch
      responses:
        "200":
          description: Current setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySettings"
        "503":
          description: Personal memory is not available on this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putMemorySettings
      x-milestone: M1-T10
      tags: [memory]
      summary: Set the personal-memory pause switch
      description: >-
        Turning it off stops new writes and cross-session recall for any
        NEWLY STARTED run from the moment this returns; existing assertions
        are kept, and the setting survives a daemon restart. Does not affect
        a run that is already resuming from an approval wait — that run
        replays its own already-persisted messages (which captured whatever
        this switch said at the moment IT started) rather than re-deciding
        anything against the current value of this switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySettings"
      responses:
        "200":
          description: The stored setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySettings"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Personal memory is not available on this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sin90/directions:
