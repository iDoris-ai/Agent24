# TUI-1 / ADR-037 "TUI 能力对齐" 豁免表。
# CI (scripts/tui-coverage.mjs) 语义是「不降」：protocol/openapi.yaml 的每个 operation 必须
# 被 CLI (rust/apps/agent24-cli) 覆盖，或在此登记。补上 CLI 命令后必须同步删除对应条目
# （脚本会把「已覆盖却仍在豁免」判为失败）。
# category: visual | planned-tui-2 | planned-tui-3（ADR-037 §4：豁免只限纯视觉能力）
#   visual           视觉类功能，终端不做
#   planned-tui-2    计划在 TUI-2 补（管理/观测类命令）
#   planned-tui-3    计划在 TUI-3 补（Sin90 / documents 领域命令）
# fallback: CLI 补齐前的兜底方式。raw-http = 对 daemon 直接发 HTTP（Bearer token，端口/token 见 daemon ready 行）。
exemptions:
  - operationId: revokeModuleConsents
    category: planned-tui-2
    fallback: "raw-http，TUI-2 增加对应 agent24 子命令"
  - operationId: revokeModuleToolConsent
    category: planned-tui-2
    fallback: "raw-http，TUI-2 增加对应 agent24 子命令"
